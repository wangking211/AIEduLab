<!DOCTYPE html>

<style>

    .katex { font-size: 1.02em; }

    input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:#4f46e5; cursor:pointer; border:2px solid #fff; box-shadow:0 1px 3px rgba(0,0,0,.3); }
    .scroll-thin::-webkit-scrollbar { width:6px; }
    .scroll-thin::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:3px; }

<body class="bg-slate-100 text-slate-900">
<div class="flex h-screen overflow-hidden">
    <!-- 左：题面 + 动态控制台 -->
    <aside class="w-[30%] min-w-[300px] max-w-[420px] bg-white border-r border-slate-200 flex flex-col">
        <div class="px-5 py-4 border-b border-slate-200">
            <div class="text-[11px] uppercase tracking-wider text-indigo-500 font-bold mb-1">互动教学 · 题面</div>
            <h1 id="prob-title" class="text-lg font-bold text-slate-900"></h1>
        </div>
        <div class="flex-1 overflow-y-auto scroll-thin px-5 py-4 text-sm leading-relaxed" id="prob-body"></div>
        <div class="border-t border-slate-200 px-5 py-4 bg-slate-50">
            <div class="text-[11px] uppercase tracking-wider text-teal-600 font-bold mb-3" id="console-title">动态控制台</div>
            <!-- 参数滑块 -->
            <div id="param-block" class="hidden">
                <div class="flex justify-between text-xs text-slate-600 mb-1"><span id="param-label"></span><span id="param-val" class="font-mono font-bold text-teal-700"></span></div>

            <!-- 能量/功率条 -->

                <div class="h-5 w-full bg-slate-200 rounded-full overflow-hidden flex text-[10px] text-white font-bold">
                    <div id="bar-seg1" class="h-full flex items-center justify-center" style="width:0%;background:#4f46e5"></div>
                    <div id="bar-seg2" class="h-full flex items-center justify-center" style="width:0%;background:#0ea5e9"></div>
                </div>

            <!-- 定值指示器 -->

    <!-- 右：物理画板 -->

        </div>
        <div class="flex-1 relative"><canvas id="physics-canvas" class="absolute inset-0"></canvas></div>

<script type="application/json" id="lesson-data">__LESSON_DATA__</script>
<script>
"use strict";
// ===================== 数据装载 =====================
const DATA = JSON.parse(document.getElementById('lesson-data').textContent);
const BOARD = DATA.board || {};
const UI = Object.assign({
    consoleTitle: "动态控制台", solutionTitle: "详细解析", current: "当前:"
}, (DATA.lesson && DATA.lesson.ui) || {});

const COLORS = {
    force:'#f87171', effort:'#38bdf8', aux:'#94a3b8', label:'#e2e8f0',
    obj:'#a78bfa', load:'#fbbf24', rope:'#e2e8f0', water:'#38bdf8',
    water2:'#0ea5e9', sponge:'#34d399', ground:'#64748b', metal:'#cbd5e1',
    wire:'#94a3b8', current:'#22d3ee', battery:'#facc15', bulb:'#fde047',
    meter:'#f472b6', arrow:'#f87171', good:'#34d399', bad:'#f87171'
};
const col = c => (c && COLORS[c]) ? COLORS[c] : (c || '#e2e8f0');

// ===================== 安全表达式求值 =====================
// 表达式由 generate.py 生成（可信本地内容）：可用 @param 名(或别名 p)、+ - * / ^、
// 及 sqrt/abs/min/max/pow/sign/PI 等白名单函数。
const MATHENV = {sqrt:Math.sqrt, abs:Math.abs, min:Math.min, max:Math.max,
    pow:Math.pow, sign:Math.sign, floor:Math.floor, ceil:Math.ceil, PI:Math.PI, E:Math.E,
    sin:Math.sin, cos:Math.cos, tan:Math.tan, asin:Math.asin, acos:Math.acos, atan:Math.atan, exp:Math.exp, log:Math.log};
const _exprCache = {};
function evalExpr(expr, env){
    if (typeof expr !== 'string') return expr;
    const scope = Object.assign({}, MATHENV, env);
    const names = Object.keys(scope);
    const key = expr + '|' + names.join(',');
    let fn = _exprCache[key];
    if (!fn){ try { fn = Function(...names, '"use strict";return ('+expr.replace(/\^/g,'**')+');'); }
              catch(e){ fn = () => NaN; } _exprCache[key] = fn; }
    try { const v = fn(...names.map(n=>scope[n])); return (typeof v==='number') ? v : NaN; }
    catch(e){ return NaN; }
}
const resolveVal = (v, env) => (typeof v === 'string') ? evalExpr(v, env) : v;
function fmt(x, d=2){
    if (x === null || x === undefined || !isFinite(x)) return '—';
    let s = x.toFixed(d);
    if (s === '-' + (0).toFixed(d)) s = (0).toFixed(d);
    return s;
}

// ===================== 画布与世界坐标 =====================
const canvas = document.getElementById('physics-canvas');
const ctx = canvas.getContext('2d');
let cssW = 0, cssH = 0, sc = 1, offX = 0, offY = 0;
const view = BOARD.view || {xRange:[0,10], yRange:[0,6]};
const SX = x => offX + x*sc;
const SY = y => offY - y*sc;

function resizeCanvas(){
    const rect = canvas.parentElement.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width*dpr; canvas.height = rect.height*dpr;
    canvas.style.width = rect.width+'px'; canvas.style.height = rect.height+'px';
    ctx.setTransform(1,0,0,1,0,0); ctx.scale(dpr,dpr);
    cssW = rect.width; cssH = rect.height;
    const spanX = view.xRange[1]-view.xRange[0], spanY = view.yRange[1]-view.yRange[0];
    sc = Math.min((rect.width-30)/spanX, (rect.height-30)/spanY);
    offX = rect.width/2 - ((view.xRange[0]+view.xRange[1])/2)*sc;
    offY = rect.height/2 + ((view.yRange[0]+view.yRange[1])/2)*sc;
    render();
}

// ===================== 绘制基元 =====================
function arrow(x1,y1,x2,y2,color,lw=2.5,label=null){
    const px1=SX(x1), py1=SY(y1), px2=SX(x2), py2=SY(y2);
    const dx=px2-px1, dy=py2-py1, L=Math.hypot(dx,dy);
    if (L < 4) return;
    const ang=Math.atan2(dy,dx), hl=Math.min(10, L*0.45);
    ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=lw;
    ctx.beginPath(); ctx.moveTo(px1,py1); ctx.lineTo(px2-hl*Math.cos(ang), py2-hl*Math.sin(ang)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(px2,py2);
    ctx.lineTo(px2-hl*Math.cos(ang-0.42), py2-hl*Math.sin(ang-0.42));
    ctx.lineTo(px2-hl*Math.cos(ang+0.42), py2-hl*Math.sin(ang+0.42));
    ctx.closePath(); ctx.fill();
    if (label){
        ctx.font='bold 12px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
        const mx=(px1+px2)/2, my=(py1+py2)/2;
        const ox=Math.cos(ang+Math.PI/2)*13, oy=Math.sin(ang+Math.PI/2)*13;
        ctx.fillText(label, mx+ox, my+oy);
    }
}
function label(x,y,text,color='#e2e8f0',align='center',size=12){
    ctx.font='bold '+size+'px system-ui'; ctx.textAlign=align; ctx.textBaseline='middle';
    ctx.fillStyle=color; ctx.fillText(text, SX(x), SY(y));
}
function dashLine(x1,y1,x2,y2,color='#94a3b8',lw=1.2){
    ctx.strokeStyle=color; ctx.lineWidth=lw; ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(SX(x1),SY(y1)); ctx.lineTo(SX(x2),SY(y2)); ctx.stroke();
    ctx.setLineDash([]);
}
function rectBox(x,y,w,h,fill,stroke=null,lw=1.5){
    ctx.fillStyle=fill;
    ctx.fillRect(SX(x), SY(y+h), w*sc, h*sc);
    if (stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw; ctx.strokeRect(SX(x), SY(y+h), w*sc, h*sc); }
}
function groundLine(y, x0, x1, color='#64748b'){
    ctx.strokeStyle=color; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(SX(x0),SY(y)); ctx.lineTo(SX(x1),SY(y)); ctx.stroke();
    ctx.lineWidth=1.2;
    for (let x=x0; x<x1; x+=0.28){
        ctx.beginPath(); ctx.moveTo(SX(x),SY(y)); ctx.lineTo(SX(x)-6,SY(y)+8); ctx.stroke();
    }
}
// 标尺线（标注长度 L 的辅助线：两端短横 + 虚线 + 中点标签）
function dimLine(x1,y1,x2,y2,text,color='#94a3b8'){
    dashLine(x1,y1,x2,y2,color);
    ctx.strokeStyle=color; ctx.lineWidth=1.5;
    const nx=(y2===y1)?0:0, ny=(x2===x1)?0:0;
    ctx.beginPath(); ctx.moveTo(SX(x1),SY(y1)-5+ny); ctx.lineTo(SX(x1),SY(y1)+5+ny); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(SX(x2),SY(y2)-5); ctx.lineTo(SX(x2),SY(y2)+5); ctx.stroke();
    label((x1+x2)/2, (y1+y2)/2 + 0.22, text, color);
}

// ===================== 场景状态 =====================
let PARAM_NAME = null;
function buildScene(pval){
    const env = {p: pval};
    if (PARAM_NAME) env[PARAM_NAME] = pval;
    (BOARD.scalars||[]).forEach(s=>{ env[s.name] = evalExpr(s.expr, env); });
    const sc2 = BOARD.scene || {};
    const out = {kind: sc2.kind, env, raw:{}};
    // 把场景各数值字段（可为表达式）按 env 解析
    for (const k in sc2){
        if (k === 'kind') continue;
        const v = sc2[k];
        out.raw[k] = v;
        if (typeof v === 'number') out[k] = v;
        else if (typeof v === 'string'){ const v2 = evalExpr(v, env); out[k] = isFinite(v2) ? v2 : v; }
        else if (Array.isArray(v)) out[k] = v.map(z => (typeof z==='string')? evalExpr(z,env) : z);
        else out[k] = v;
    }
    return out;
}
// ===================== 场景绘制（高中力学） =====================
let animT = 0;                                    // 动画时钟（秒）

// ---- 1) 水平传送带：物块滑上带面，带用滚动箭头表示 ----
function drawBelt(S){
    const gy=1.9, x0=0.6, x1=9.4;
    // 带面（上下两条滚轮线）
    ctx.fillStyle='#1e293b'; ctx.fillRect(SX(x0), SY(gy), (x1-x0)*sc, 0.5*sc);
    ctx.strokeStyle='#475569'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(SX(x0),SY(gy+0.5)); ctx.lineTo(SX(x1),SY(gy+0.5)); ctx.stroke();
    // 滚轮
    [x0+0.25, x1-0.25].forEach(rx=>{
        ctx.fillStyle='#334155'; ctx.beginPath(); ctx.arc(SX(rx),SY(gy+0.25),0.22*sc,0,7); ctx.fill();
        ctx.strokeStyle=col('metal'); ctx.lineWidth=2.5; ctx.stroke();
    });
    // 带速方向箭头（多个小箭头滚动感）
    const dir = Math.sign(S.vbelt)||1;
    ctx.strokeStyle='#64748b'; ctx.fillStyle='#64748b'; ctx.lineWidth=1.6;
    for (let rx=x0+1.2; rx<x1-0.8; rx+=1.6){
        const yy=gy+0.25;
        ctx.beginPath(); ctx.moveTo(SX(rx),SY(yy)); ctx.lineTo(SX(rx+0.5),SY(yy)); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(SX(rx+0.5),SY(yy));
        ctx.lineTo(SX(rx+0.35),SY(yy+0.09)); ctx.lineTo(SX(rx+0.35),SY(yy-0.09)); ctx.closePath(); ctx.fill();
    }
    label(x1-0.5, gy+0.75, 'v带='+fmt(S.vbelt,1)+'m/s', '#94a3b8', 'end', 11);
    // 物块（位置 x1b = 初位置 + 物块位移）
    const bx=S.xblk, bw=S.boxW||0.9, bh=0.55;
    rectBox(bx-bw/2, gy+0.5, bw, bh, col('obj'), '#0f172a');
    label(bx, gy+0.5+bh/2, 'm', '#0f172a', 'center', 12);
    // 物块速度箭头
    if (Math.abs(S.vblk)>0.01)
        arrow(bx, gy+0.5+bh+0.28, bx+dir2(S.vblk)*Math.min(Math.abs(S.vblk)*0.22,1.6), gy+0.5+bh+0.28, 'effort', 3,
              'v='+fmt(S.vblk,2)+'m/s');
    // 摩擦力箭头（方向与相对速度相反）
    if (Math.abs(S.ffric)>0.01)
        arrow(bx, gy+0.5+bh/2, bx+dir2(S.ffric)*Math.min(Math.abs(S.ffric)*S.fscale,1.4), gy+0.5+bh/2, 'force', 3,
              'f='+fmt(S.ffric,1)+'N');
    // 划痕（相对位移）标注：带面刻痕
    if (S.scratchPx>0.05){
        ctx.strokeStyle=col('bad'); ctx.lineWidth=3; ctx.setLineDash([4,3]);
        ctx.beginPath(); ctx.moveTo(SX(S.xbeltStart),SY(gy+0.52)); ctx.lineTo(SX(S.xbeltStart+S.scratchPx),SY(gy+0.52)); ctx.stroke();
        ctx.setLineDash([]);
        label(S.xbeltStart+S.scratchPx/2, gy+0.95, '划痕Δs='+fmt(S.scratchLen,2)+'m', col('bad'), 'center', 11);
    }
    label(0.6, gy+2.0, S.phase||'', '#facc15', 'start', 12);
}
const dir2 = v => Math.sign(v)||1;

// ---- 2) 追及相遇：A 匀速、B 匀加速，公路 + 两车 ----
function drawChase(S){
    const gy=1.6, x0=0.4, x1=9.6;
    groundLine(gy, x0, x1);
    const kx=S.kx||1;                       // 世界单位 / 米
    // 刻度（真实米数，每 10m 一格）
    ctx.strokeStyle='#334155'; ctx.lineWidth=1;
    for (let m=0; x0+m*kx<=x1-0.2; m+=10){ const wx=x0+m*kx;
        ctx.beginPath(); ctx.moveTo(SX(wx),SY(gy)); ctx.lineTo(SX(wx),SY(gy-0.14)); ctx.stroke();
        label(wx, gy-0.32, m+'', '#64748b', 'center', 10); }
    label(x1-0.3, gy-0.32, 'x/m', '#64748b', 'end', 10);
    // A 车（匀速）— S.xA 为真实米数
    const ax=x0+S.xA*kx;
    rectBox(ax-0.45, gy, 0.9, 0.42, col('effort'), '#0f172a');
    label(ax, gy+0.21, 'A', '#0f172a', 'center', 12);
    if (Math.abs(S.vA)>0.01) arrow(ax+0.55, gy+0.62, ax+0.55+Math.min(S.vA*0.12,1.3), gy+0.62, 'effort', 2.5, 'vA='+fmt(S.vA,0)+'m/s');
    // B 车（匀加速）
    const bx=x0+S.xB*kx;
    rectBox(bx-0.45, gy+0.5, 0.9, 0.42, col('force'), '#0f172a');
    label(bx, gy+0.71, 'B', '#0f172a', 'center', 12);
    if (Math.abs(S.vB)>0.01) arrow(bx+0.6, gy+1.12, bx+0.6+Math.min(S.vB*0.12,1.3), gy+1.12, 'force', 2.5, 'vB='+fmt(S.vB,1)+'m/s');
    // 间距标注（真实米数）
    if (Math.abs(S.xB-S.xA)*kx>0.3){
        const lo=Math.min(ax,bx), hi=Math.max(ax,bx);
        dimLine(lo, gy-0.62, hi, gy-0.62, 'Δx='+fmt(Math.abs(S.xB-S.xA),2)+'m', '#facc15');
    }
    label(0.4, gy+2.6, 't='+fmt(S.t,2)+'s', '#facc15', 'start', 13);
}

// ---- 3) 斜面：倾角 θ，物块沿斜面上滑 ----
function drawRamp(S){
    const bx0=0.7, by0=1.1, L=S.rampLen||8.6;
    const th=(S.theta_deg||0)*Math.PI/180;
    const ux=Math.cos(th), uy=Math.sin(th);
    const ex=bx0+L*ux, ey=by0+L*uy;
    // 斜面三角形
    ctx.fillStyle='#1e293b'; ctx.beginPath();
    ctx.moveTo(SX(bx0),SY(by0)); ctx.lineTo(SX(ex),SY(ey));
    ctx.lineTo(SX(ex),SY(by0)); ctx.closePath(); ctx.fill();
    ctx.strokeStyle=col('ground'); ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(SX(bx0),SY(by0)); ctx.lineTo(SX(ex),SY(ey)); ctx.stroke();
    groundLine(by0, bx0-0.3, ex+0.4);
    // 倾角弧 + 标注
    ctx.strokeStyle='#facc15'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(SX(bx0),SY(by0),0.75*sc, 0, -th, true); ctx.stroke();
    label(bx0+1.15, by0-0.22, 'θ='+fmt(S.theta_deg,0)+'°', '#facc15', 'start', 12);
    // 物块：沿斜面距底端 s
    const s=Math.max(0, Math.min(S.s_blk, L-0.8));
    const px=bx0+s*ux, py=by0+s*uy;
    // 旋转绘制物块
    ctx.save();
    ctx.translate(SX(px),SY(py)); ctx.rotate(-th);
    const bw=(S.boxW||0.7)*sc, bh=0.42*sc;
    ctx.fillStyle=col('obj'); ctx.fillRect(-bw/2, -bh, bw, bh);
    ctx.strokeStyle='#0f172a'; ctx.lineWidth=2; ctx.strokeRect(-bw/2, -bh, bw, bh);
    ctx.fillStyle='#0f172a'; ctx.font='bold 11px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('m', 0, -bh/2);
    ctx.restore();
    // 速度方向箭头（沿斜面）
    const vdir=Math.sign(S.v_blk)||1;
    if (Math.abs(S.v_blk)>0.01){
        const tang=[ux*vdir, uy*vdir];
        arrow(px+tang[0]*0.42, py+tang[1]*0.42,
              px+tang[0]*(0.42+Math.min(Math.abs(S.v_blk)*0.16,1.4)), py+tang[1]*(0.42+Math.min(Math.abs(S.v_blk)*0.16,1.4)),
              'effort', 3, 'v='+fmt(S.v_blk,1)+'m/s');
    }
    // 重力 + 分量
    arrow(px, py-0.25, px, py-0.25-Math.min(S.G*S.fscale,1.5), 'force', 3, 'G='+fmt(S.G,0)+'N');
    // 支持力（垂直斜面向外）
    const nrm=[-uy, ux];
    arrow(px, py-0.1, px+nrm[0]*Math.min(S.N*S.fscale,1.3), py+nrm[1]*Math.min(S.N*S.fscale,1.3), 'good', 2.5, 'N');
    // 摩擦力（沿斜面，与运动方向相反）
    if (Math.abs(S.f_fric)>0.01)
        arrow(px, py+0.12, px-ux*vdir*Math.min(S.f_fric*S.fscale,1.2), py-uy*vdir*Math.min(S.f_fric*S.fscale,1.2), 'meter', 2.5, 'f');
    label(8.6, 0.55, 's='+fmt(S.sdisp!=null?S.sdisp:S.s_blk,2)+'m', '#facc15', 'end', 12);
}

// ---- 4) 抛体运动：轨迹曲线 + 当前点 + 速度分量 ----
function drawProjectile(S){
    const ox=0.9, oy=S.h0+0.7;         // 抛出点（世界坐标）
    const g=S.g||10, v0=S.v0, th=(S.theta_deg||0)*Math.PI/180;
    const vx=v0*Math.cos(th), vy0=v0*Math.sin(th);
    // 轨迹采样
    const tTot=S.t_total||3;
    ctx.strokeStyle=col('curve')||'#facc15'; ctx.strokeStyle='#facc15'; ctx.lineWidth=2; ctx.setLineDash([6,4]);
    ctx.beginPath();
    let started=false;
    for (let i=0;i<=160;i++){
        const tt=tTot*i/160;
        const xx=ox+vx*tt, yy=oy+vy0*tt-g*tt*tt/2;
        if (yy<0.35) break;
        if (!started){ ctx.moveTo(SX(xx),SY(yy)); started=true; } else ctx.lineTo(SX(xx),SY(yy));
    }
    ctx.stroke(); ctx.setLineDash([]);
    // 地面
    groundLine(0.35, 0.2, 9.8);
    // 当前点
    const cx=ox+vx*S.t, cy=Math.max(0.35, oy+vy0*S.t-g*S.t*S.t/2);
    // 速度分量
    const vyv=vy0-g*S.t;
    const sc2=S.vscale||0.16;
    arrow(cx, cy, cx+Math.min(vx*sc2,2.0), cy, 'effort', 3, 'vx='+fmt(vx,1));
    if (Math.abs(vyv)>0.05)
        arrow(cx, cy, cx, cy+Math.sign(vyv)*Math.min(Math.abs(vyv)*sc2,2.0), 'force', 3, 'vy='+fmt(vyv,1));
    // 合速度
    arrow(cx, cy, cx+Math.min(vx*sc2,2.0), cy+Math.sign(vyv)*Math.min(Math.abs(vyv)*sc2,2.0), 'good', 2, null);
    ctx.fillStyle='#f472b6'; ctx.beginPath(); ctx.arc(SX(cx),SY(cy),6,0,7); ctx.fill();
    ctx.strokeStyle='#0f172a'; ctx.lineWidth=2; ctx.stroke();
    label(0.4, 5.6, 't='+fmt(S.t,2)+'s  高度h='+fmt(S.hdisp!=null?S.hdisp:Math.max(0,cy-0.35),2)+'m', '#facc15', 'start', 12);
    // 最高点标记
    if (S.H>0.05){
        const typ=oy+S.H-(S.h0||0)+0;  // 世界最高点 y
        dashLine(0.2, typ, 9.8, typ, '#475569', 1);
        label(9.6, typ+0.22, 'H='+fmt(S.Hdisp!=null?S.Hdisp:S.H,2)+'m', '#64748b', 'end', 11);
    }
}

// ---- 5) 水平面上的滑块（牛二/动能定理）：F 拉、摩擦、位移 ----
function drawGround(S){
    const gy=2.2, x0=0.3, x1=9.7;
    groundLine(gy, x0, x1);
    const bx=S.x_blk, bw=S.boxW||1.0, bh=0.6;
    rectBox(bx-bw/2, gy, bw, bh, col('obj'), '#0f172a');
    label(bx, gy+bh/2, 'm='+fmt(S.m,0)+'kg', '#0f172a', 'center', 11);
    // 拉力 F（水平，带角度可选但默认水平）
    if (Math.abs(S.F)>0.01)
        arrow(bx+bw/2, gy+bh/2, bx+bw/2+Math.min(S.F*S.fscale,2.2), gy+bh/2, 'effort', 3.5, 'F='+fmt(S.F,1)+'N');
    // 摩擦力
    if (Math.abs(S.f_fric)>0.01)
        arrow(bx-bw/2, gy+bh/2, bx-bw/2-Math.min(S.f_fric*S.fscale,1.6), gy+bh/2, 'force', 3, 'f='+fmt(S.f_fric,1)+'N');
    // 重力 + 支持力（小箭头，竖直）
    arrow(bx, gy+bh, bx, gy+bh+Math.min(S.G*S.fscale,1.1), 'aux', 2, 'N');
    arrow(bx, gy, bx, gy-Math.min(S.G*S.fscale,1.1), 'aux', 2, 'G');
    // 位移标注
    if (S.s_blk>0.05){
        dimLine(S.x_start, gy-0.45, bx, gy-0.45, 's='+fmt(S.s_blk,2)+'m', '#facc15');
    }
    // 速度箭头
    if (Math.abs(S.v_blk)>0.01)
        arrow(bx, gy+bh+0.42, bx+Math.sign(S.v_blk)*Math.min(Math.abs(S.v_blk)*S.vscale,1.8), gy+bh+0.42, 'good', 2.5, 'v='+fmt(S.v_blk,2)+'m/s');
    label(0.3, gy+2.3, 't='+fmt(S.t,2)+'s', '#facc15', 'start', 12);
}

// ---- 6) 圆周运动：竖直圆环（绳/杆模型）+ 最高/最低点 ----
function drawCircle(S){
    const cx=4.9, cy=3.3, r=S.r;
    // 圆环
    ctx.strokeStyle='#475569'; ctx.lineWidth=2; ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.arc(SX(cx),SY(cy),r*sc,0,7); ctx.stroke(); ctx.setLineDash([]);
    // 圆心 + 半径
    ctx.fillStyle='#94a3b8'; ctx.beginPath(); ctx.arc(SX(cx),SY(cy),3,0,7); ctx.fill();
    label(cx+0.3, cy, 'O', '#94a3b8', 'start', 12);
    dashLine(cx, cy, cx+r*Math.cos(S.theta), cy+r*Math.sin(S.theta), '#64748b', 1.2);
    label(cx+r*Math.cos(S.theta)/2+0.25, cy+r*Math.sin(S.theta)/2, 'r='+fmt(r,2)+'m', '#94a3b8', 'start', 11);
    // 小球（角度 theta 从最高点逆时针？约定：theta=0 最高点，顺时针为正方向运动）
    const ang=-Math.PI/2 + (S.clockwise?1:-1)*S.theta;
    const px=cx+r*Math.cos(ang), py=cy+r*Math.sin(ang);
    ctx.fillStyle=col('ptA')||'#f87171'; ctx.fillStyle='#f87171';
    ctx.beginPath(); ctx.arc(SX(px),SY(py),0.19*sc,0,7); ctx.fill();
    ctx.strokeStyle='#0f172a'; ctx.lineWidth=2; ctx.stroke();
    // 速度（切向）
    const tdir=(S.clockwise?1:-1);
    const tang=[-Math.sin(ang)*tdir, Math.cos(ang)*tdir];
    if (Math.abs(S.v)>0.01)
        arrow(px, py, px+tang[0]*Math.min(S.v*S.vscale,1.5), py+tang[1]*Math.min(S.v*S.vscale,1.5), 'effort', 3, 'v='+fmt(S.v,1)+'m/s');
    // 向心力（指向圆心）
    const cdir=[cx-px, cy-py]; const cL=Math.hypot(cdir[0],cdir[1])||1;
    arrow(px, py, px+cdir[0]/cL*Math.min(S.F_c*S.fscale,1.4), py+cdir[1]/cL*Math.min(S.F_c*S.fscale,1.4), 'force', 3.5, 'F向='+fmt(S.F_c,1)+'N');
    // 重力（最低/最高点处强调）
    arrow(px, py-0.25, px, py-0.25-Math.min((S.m*(S.g||10))*S.fscale,1.1), 'aux', 2, 'mg');
    // 位置说明
    const posName = S.theta<0.05?'最高点':(Math.abs(S.theta-Math.PI)<0.05?'最低点':(S.theta<Math.PI?'右侧':'左侧'));
    label(0.35, 6.1, '位置：'+posName+'（θ='+fmt(S.theta*180/Math.PI,0)+'°）', '#facc15', 'start', 12);
    label(9.6, 6.1, 'v='+fmt(S.v,2)+' m/s', '#facc15', 'end', 12);
}

// ---- 7) v-t 图像：轨迹 + 阴影面积（位移）----
function drawVT(S){
    // 图坐标系（嵌入式）：x 轴 t∈[0,tmax]，y 轴 v∈[vmin,vmax]
    const px0=1.1, px1=9.4, py0=0.8, py1=5.6;
    const tmax=S.tmax, vmin=S.vmin, vmax=S.vmax;
    const X = t => px0 + (t/tmax)*(px1-px0);
    const Y = v => py0 + ((v-vmin)/(vmax-vmin))*(py1-py0);
    // 轴
    ctx.strokeStyle='#94a3b8'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(SX(px0),SY(Y(0))); ctx.lineTo(SX(px1),SY(Y(0))); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(SX(px0),SY(py0)); ctx.lineTo(SX(px0),SY(Y(0))); ctx.lineTo(SX(px1),SY(Y(0))); ctx.stroke();
    label(px1-0.1, Y(0)-0.3, 't/s', '#94a3b8', 'end', 11);
    label(px0-0.15, py1+0.1, 'v/(m·s⁻¹)', '#94a3b8', 'center', 11);
    // 刻度
    for (let t=0;t<=tmax;t+=tmax/5){ label(X(t), Y(0)-0.28, fmt(t,1), '#64748b', 'center', 10);
        ctx.strokeStyle='#334155'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(SX(X(t)),SY(Y(0))); ctx.lineTo(SX(X(t)),SY(Y(0)-0.08)); ctx.stroke(); }
    for (let v=Math.ceil(vmin); v<=vmax; v+=Math.max(1,Math.round((vmax-vmin)/5))){ label(px0-0.12, Y(v), v+'', '#64748b', 'end', 10);
        ctx.strokeStyle='#334155'; ctx.beginPath(); ctx.moveTo(SX(px0),SY(Y(v))); ctx.lineTo(SX(px0-0.08),SY(Y(v))); ctx.stroke(); }
    // 分段折线（v-t 曲线，由 pts 数组 [t,v] 提供）
    const pts=S.vt_pts||[];
    ctx.strokeStyle='#facc15'; ctx.lineWidth=3; ctx.lineJoin='round';
    ctx.beginPath(); pts.forEach((p,i)=> i?ctx.lineTo(SX(X(p[0])),SY(Y(p[1]))):ctx.moveTo(SX(X(p[0])),SY(Y(p[1])))); ctx.stroke();
    // 阴影（位移 = 面积，t∈[0,t]）
    const tt=Math.max(0, Math.min(S.t, tmax));
    ctx.fillStyle='rgba(56,189,248,0.22)';
    ctx.beginPath(); ctx.moveTo(SX(X(0)),SY(Y(0)));
    // 沿折线插值到 tt
    let cur=null;
    pts.forEach((p,i)=>{ if (p[0]<=tt) ctx.lineTo(SX(X(p[0])),SY(Y(p[1]))); });
    // 插值点
    for (let i=1;i<pts.length;i++){ if (pts[i-1][0]<=tt && pts[i][0]>=tt){
        const f=(tt-pts[i-1][0])/(pts[i][0]-pts[i-1][0]||1);
        cur=[tt, pts[i-1][1]+(pts[i][1]-pts[i-1][1])*f]; ctx.lineTo(SX(X(cur[0])),SY(Y(cur[1]))); break; } }
    if (!cur && pts.length) cur=[pts[0][0], pts[0][1]];
    ctx.lineTo(SX(X(tt)),SY(Y(0))); ctx.closePath(); ctx.fill();
    // 当前点
    if (cur){
        ctx.fillStyle='#f472b6'; ctx.beginPath(); ctx.arc(SX(X(tt)),SY(Y(cur[1])),6,0,7); ctx.fill();
        ctx.strokeStyle='#0f172a'; ctx.lineWidth=2; ctx.stroke();
        label(X(tt), Y(cur[1])+0.32, 'v='+fmt(cur[1],2), '#f472b6', 'center', 11);
    }
    dashLine(X(tt), Y(0), X(tt), py1, '#94a3b8', 1);
    label(X(tt), Y(0)-0.28, 't='+fmt(tt,2), '#facc15', 'center', 11);
    label(9.4, 5.9, '阴影面积 = 位移 s='+fmt(S.s_blk,2)+' m', '#38bdf8', 'end', 12);
}

// ===================== 渲染主入口 =====================
function render(){
    ctx.clearRect(0,0,cssW,cssH);
    const S = buildScene(curParam);
    switch(S.kind){
        case 'belt': drawBelt(S); break;
        case 'chase': drawChase(S); break;
        case 'ramp': drawRamp(S); break;
        case 'projectile': drawProjectile(S); break;
        case 'ground': drawGround(S); break;
        case 'circle': drawCircle(S); break;
        case 'vt': drawVT(S); break;
    }
    updateReadouts(S);
}

// ===================== 读数 =====================
function updateReadouts(S){
    (BOARD.readouts||[]).forEach(r=>{
        const el=document.getElementById('ro-'+r.id);
        if (!el) return;
        try{
            if (r.type==='expr'){
                const v=evalExpr(r.expr, S.env);
                el.textContent=fmt(v, r.digits!=null?r.digits:2)+(r.unit?' '+r.unit:'');
            } else if (r.type==='status'){
                const v=evalExpr(r.expr, S.env), rhs=(r.rhs!=null?r.rhs:0), op=r.op||'>';
                const ok = op==='<'? v<rhs-1e-9 : op==='>'? v>rhs+1e-9 : op==='=='? Math.abs(v-rhs)<1e-6 : v>rhs-1e-9;
                el.textContent = ok?(r.okText||'满足'):(r.badText||'不满足');
                el.style.color = ok?'#059669':'#dc2626';
            }
        }catch(e){ el.textContent='—'; }
    });
    // 能量/功率条
    if (BOARD.bars){
        const a=evalExpr(BOARD.bars.a.expr, S.env), b=evalExpr(BOARD.bars.b.expr, S.env);
        const A=isFinite(a)&&a>0?a:0, B=isFinite(b)&&b>0?b:0, T=A+B||1;
        document.getElementById('bar-seg1').style.width=(A/T*100)+'%';
        document.getElementById('bar-seg2').style.width=(B/T*100)+'%';
        document.getElementById('bar-seg1').textContent=fmt(A,1);
        document.getElementById('bar-seg2').textContent=fmt(B,1);
    }
}

// ===================== 控制台构建 =====================
function renderKatex(el){ if (typeof renderMathInElement!=='undefined') renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}],throwOnError:false}); }
let curParam = BOARD.param ? (BOARD.param.value!==undefined?BOARD.param.value:BOARD.param.min) : 0;
function buildConsole(){
    document.getElementById('prob-title').textContent=(DATA.lesson&&DATA.lesson.title)||'';
    document.getElementById('prob-body').innerHTML=(DATA.lesson&&DATA.lesson.problem)||'';
    document.getElementById('scene-caption').textContent=(BOARD.scene&&BOARD.scene.caption)||'';
    const p=BOARD.param;
    if (p){
        document.getElementById('param-block').classList.remove('hidden');
        document.getElementById('param-label').innerHTML=(p.label||p.name)+' :';
        const s=document.getElementById('param-slider');
        s.min=p.min; s.max=p.max; s.step=p.step||0.5; s.value=curParam;
        document.getElementById('param-ticks').innerHTML=(p.ticks||[`${p.min}${p.unit||''}`,`${p.max}${p.unit||''}`]).map(t=>`<span>${t}</span>`).join('');
        s.addEventListener('input', ()=>{ curParam=parseFloat(s.value); syncParamVal(); render(); });
        syncParamVal();
    }
    document.getElementById('readouts').innerHTML=(BOARD.readouts||[]).map(r=>{
        if (r.highlight) return `<div class="flex justify-between items-center pt-1"><span class="text-slate-800 font-semibold">${r.label}:</span><span id="ro-${r.id}" class="text-base font-bold bg-teal-50 text-teal-700 px-3 py-1 rounded-lg border border-teal-200">—</span></div>`;
        return `<div class="flex justify-between border-b border-dashed border-slate-200 pb-1"><span>${r.label}:</span><span id="ro-${r.id}" class="font-bold" style="color:${r.color?col(r.color):'#0f172a'}">—</span></div>`;
    }).join('');
    if (BOARD.bars){
        document.getElementById('bar-block').classList.remove('hidden');
        document.getElementById('bar-label').textContent=BOARD.bars.label||'';
        document.getElementById('bar-legend').innerHTML=
            `<span><span class="inline-block w-2 h-2 rounded-sm" style="background:#4f46e5"></span> ${BOARD.bars.a.label}</span>`+
            `<span><span class="inline-block w-2 h-2 rounded-sm" style="background:#0ea5e9"></span> ${BOARD.bars.b.label}</span>`;
    }
    if (BOARD.constant){ document.getElementById('constant-block').classList.remove('hidden');
        document.getElementById('constant-val').innerHTML='≡ '+(BOARD.constant.label||''); }
    const legend=document.getElementById('legend'); const items=[];
    (BOARD.legend||[]).forEach(it=> items.push(`<div class="flex items-center gap-2"><span class="w-3 h-3 inline-block rounded" style="background:${col(it.color)}"></span> ${it.text}</div>`));
    legend.innerHTML=items.join('');
    document.getElementById('solution-body').innerHTML=(DATA.steps||[]).map((st,i)=>{
        const no=String(i+1).padStart(2,'0');
        return `<div class="${i>0?'border-t border-slate-100 pt-5':''}">
            <div class="flex items-start gap-4 mb-3">
                <span class="w-7 h-7 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold font-mono text-sm flex-shrink-0">${no}</span>
                <h3 class="text-base font-bold text-slate-900 pt-0.5">${st.title||''}</h3>
            </div>
            <div class="prose max-w-none text-slate-700 leading-relaxed text-sm space-y-2">${st.content||''}</div>
        </div>`;
    }).join('');
    renderKatex(document.body);
}
function syncParamVal(){ document.getElementById('param-val').textContent = fmt(curParam,2)+((BOARD.param&&BOARD.param.unit)||''); }

// ===================== 主循环 =====================
function loop(now){ animT = now/1000; render(); requestAnimationFrame(loop); }
window.addEventListener('resize', resizeCanvas);
PARAM_NAME = (BOARD.param && /^[A-Za-z_$][\w$]*$/.test(BOARD.param.name||'')) ? BOARD.param.name : null;
buildConsole();
resizeCanvas();
requestAnimationFrame(loop);
</script>
