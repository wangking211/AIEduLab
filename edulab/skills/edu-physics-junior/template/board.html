<!DOCTYPE html>
<html lang="zh-CN">
<head>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
<style>
    body { font-family: "PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
    .katex { font-size: 1.02em; }
    canvas { display:block; }
    input[type=range] { -webkit-appearance:none; appearance:none; height:6px; border-radius:3px; background:#cbd5e1; outline:none; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:#4f46e5; cursor:pointer; border:2px solid #fff; box-shadow:0 1px 3px rgba(0,0,0,.3); }
    .scroll-thin::-webkit-scrollbar { width:6px; }
    .scroll-thin::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:3px; }
</style>
</head>
<body class="bg-slate-100 text-slate-900">
<div class="flex h-screen overflow-hidden">
    <!-- 左：题面 + 动态控制台 -->
    <aside class="w-[30%] min-w-[300px] max-w-[420px] bg-white border-r border-slate-200 flex flex-col">
        <div class="px-5 py-4 border-b border-slate-200">
            <div class="text-[11px] uppercase tracking-wider text-indigo-500 font-bold mb-1">互动教学 · 题面</div>
            <h1 id="prob-title" class="text-lg font-bold text-slate-900"></h1>
        </div>
        <div class="flex-1 overflow-y-auto scroll-thin px-5 py-4 text-sm leading-relaxed" id="prob-body"></div>
        <div class="border-t border-slate-200 px-5 py-4 bg-slate-50">
            <div class="text-[11px] uppercase tracking-wider text-teal-600 font-bold mb-3" id="console-title">动态控制台</div>
            <!-- 参数滑块 -->
            <div id="param-block" class="hidden">
                <div class="flex justify-between text-xs text-slate-600 mb-1"><span id="param-label"></span><span id="param-val" class="font-mono font-bold text-teal-700"></span></div>
                <input id="param-slider" type="range" class="w-full">
                <div id="param-ticks" class="flex justify-between text-[10px] text-slate-400 mt-1"></div>
            </div>
            <!-- 读数 -->
            <div id="readouts" class="mt-3 space-y-2 text-sm"></div>
            <!-- 能量/功率条 -->
            <div id="bar-block" class="hidden mt-4">
                <div class="text-xs text-slate-600 mb-1" id="bar-label"></div>
                <div class="h-5 w-full bg-slate-200 rounded-full overflow-hidden flex text-[10px] text-white font-bold">
                    <div id="bar-seg1" class="h-full flex items-center justify-center" style="width:0%;background:#4f46e5"></div>
                    <div id="bar-seg2" class="h-full flex items-center justify-center" style="width:0%;background:#0ea5e9"></div>
                </div>
                <div class="flex gap-4 text-[10px] text-slate-500 mt-1" id="bar-legend"></div>
            </div>
            <!-- 定值指示器 -->
            <div id="constant-block" class="hidden mt-4 border-t border-slate-200 pt-3">
                <span class="text-[11px] text-slate-500">定值指示</span>
                <span id="constant-val" class="ml-auto font-bold text-emerald-700"></span>

    <!-- 中：分步解析 -->
    <main class="flex-1 bg-white overflow-y-auto scroll-thin px-6 py-5">

        <div id="solution-body" class="space-y-5"></div>
    </main>
    <!-- 右：物理画板 -->
    <section class="w-[36%] min-w-[340px] bg-slate-900 flex flex-col">
        <div class="px-4 py-3 border-b border-slate-700 flex items-center justify-between">
            <div class="text-[11px] uppercase tracking-wider text-teal-400 font-bold">物理画板</div>
            <div id="scene-caption" class="text-xs text-slate-400"></div>
        </div>
        <div class="flex-1 relative"><canvas id="physics-canvas" class="absolute inset-0"></canvas></div>
        <div id="legend" class="px-4 py-3 border-t border-slate-700 text-[11px] text-slate-300 space-y-1"></div>
    </section>
</div>

<script type="application/json" id="lesson-data">__LESSON_DATA__</script>
<script>
"use strict";
// ===================== 数据装载 =====================
const DATA = JSON.parse(document.getElementById('lesson-data').textContent);
const BOARD = DATA.board || {};
const UI = Object.assign({
    consoleTitle: "动态控制台", solutionTitle: "详细解析", current: "当前:"
}, (DATA.lesson && DATA.lesson.ui) || {});

const COLORS = {
    force:'#f87171', effort:'#38bdf8', aux:'#94a3b8', label:'#e2e8f0',
    obj:'#a78bfa', load:'#fbbf24', rope:'#e2e8f0', water:'#38bdf8',
    water2:'#0ea5e9', sponge:'#34d399', ground:'#64748b', metal:'#cbd5e1',
    wire:'#94a3b8', current:'#22d3ee', battery:'#facc15', bulb:'#fde047',
    meter:'#f472b6', arrow:'#f87171', good:'#34d399', bad:'#f87171'
};
const col = c => (c && COLORS[c]) ? COLORS[c] : (c || '#e2e8f0');

// ===================== 安全表达式求值 =====================
// 表达式由 generate.py 生成（可信本地内容）：可用 @param 名(或别名 p)、+ - * / ^、
// 及 sqrt/abs/min/max/pow/sign/PI 等白名单函数。
const MATHENV = {sqrt:Math.sqrt, abs:Math.abs, min:Math.min, max:Math.max,
    pow:Math.pow, sign:Math.sign, floor:Math.floor, ceil:Math.ceil, PI:Math.PI, E:Math.E};
const _exprCache = {};
function evalExpr(expr, env){
    if (typeof expr !== 'string') return expr;
    const scope = Object.assign({}, MATHENV, env);
    const names = Object.keys(scope);
    const key = expr + '|' + names.join(',');
    let fn = _exprCache[key];
    if (!fn){ try { fn = Function(...names, '"use strict";return ('+expr.replace(/\^/g,'**')+');'); }
              catch(e){ fn = () => NaN; } _exprCache[key] = fn; }
    try { const v = fn(...names.map(n=>scope[n])); return (typeof v==='number') ? v : NaN; }
    catch(e){ return NaN; }
}
const resolveVal = (v, env) => (typeof v === 'string') ? evalExpr(v, env) : v;
function fmt(x, d=2){
    if (x === null || x === undefined || !isFinite(x)) return '—';
    let s = x.toFixed(d);
    if (s === '-' + (0).toFixed(d)) s = (0).toFixed(d);
    return s;
}

// ===================== 画布与世界坐标 =====================
const canvas = document.getElementById('physics-canvas');
const ctx = canvas.getContext('2d');
let cssW = 0, cssH = 0, sc = 1, offX = 0, offY = 0;
const view = BOARD.view || {xRange:[0,10], yRange:[0,6]};
const SX = x => offX + x*sc;
const SY = y => offY - y*sc;

function resizeCanvas(){
    const rect = canvas.parentElement.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width*dpr; canvas.height = rect.height*dpr;
    canvas.style.width = rect.width+'px'; canvas.style.height = rect.height+'px';
    ctx.setTransform(1,0,0,1,0,0); ctx.scale(dpr,dpr);
    cssW = rect.width; cssH = rect.height;
    const spanX = view.xRange[1]-view.xRange[0], spanY = view.yRange[1]-view.yRange[0];
    sc = Math.min((rect.width-30)/spanX, (rect.height-30)/spanY);
    offX = rect.width/2 - ((view.xRange[0]+view.xRange[1])/2)*sc;
    offY = rect.height/2 + ((view.yRange[0]+view.yRange[1])/2)*sc;
    render();
}

// ===================== 绘制基元 =====================
function arrow(x1,y1,x2,y2,color,lw=2.5,label=null){
    const px1=SX(x1), py1=SY(y1), px2=SX(x2), py2=SY(y2);
    const dx=px2-px1, dy=py2-py1, L=Math.hypot(dx,dy);
    if (L < 4) return;
    const ang=Math.atan2(dy,dx), hl=Math.min(10, L*0.45);
    ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=lw;
    ctx.beginPath(); ctx.moveTo(px1,py1); ctx.lineTo(px2-hl*Math.cos(ang), py2-hl*Math.sin(ang)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(px2,py2);
    ctx.lineTo(px2-hl*Math.cos(ang-0.42), py2-hl*Math.sin(ang-0.42));
    ctx.lineTo(px2-hl*Math.cos(ang+0.42), py2-hl*Math.sin(ang+0.42));
    ctx.closePath(); ctx.fill();
    if (label){
        ctx.font='bold 12px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
        const mx=(px1+px2)/2, my=(py1+py2)/2;
        const ox=Math.cos(ang+Math.PI/2)*13, oy=Math.sin(ang+Math.PI/2)*13;
        ctx.fillText(label, mx+ox, my+oy);
    }
}
function label(x,y,text,color='#e2e8f0',align='center',size=12){
    ctx.font='bold '+size+'px system-ui'; ctx.textAlign=align; ctx.textBaseline='middle';
    ctx.fillStyle=color; ctx.fillText(text, SX(x), SY(y));
}
function dashLine(x1,y1,x2,y2,color='#94a3b8',lw=1.2){
    ctx.strokeStyle=color; ctx.lineWidth=lw; ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(SX(x1),SY(y1)); ctx.lineTo(SX(x2),SY(y2)); ctx.stroke();
    ctx.setLineDash([]);
}
function rectBox(x,y,w,h,fill,stroke=null,lw=1.5){
    ctx.fillStyle=fill;
    ctx.fillRect(SX(x), SY(y+h), w*sc, h*sc);
    if (stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw; ctx.strokeRect(SX(x), SY(y+h), w*sc, h*sc); }
}
function groundLine(y, x0, x1, color='#64748b'){
    ctx.strokeStyle=color; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(SX(x0),SY(y)); ctx.lineTo(SX(x1),SY(y)); ctx.stroke();
    ctx.lineWidth=1.2;
    for (let x=x0; x<x1; x+=0.28){
        ctx.beginPath(); ctx.moveTo(SX(x),SY(y)); ctx.lineTo(SX(x)-6,SY(y)+8); ctx.stroke();
    }
}
// 标尺线（标注长度 L 的辅助线：两端短横 + 虚线 + 中点标签）
function dimLine(x1,y1,x2,y2,text,color='#94a3b8'){
    dashLine(x1,y1,x2,y2,color);
    ctx.strokeStyle=color; ctx.lineWidth=1.5;
    const nx=(y2===y1)?0:0, ny=(x2===x1)?0:0;
    ctx.beginPath(); ctx.moveTo(SX(x1),SY(y1)-5+ny); ctx.lineTo(SX(x1),SY(y1)+5+ny); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(SX(x2),SY(y2)-5); ctx.lineTo(SX(x2),SY(y2)+5); ctx.stroke();
    label((x1+x2)/2, (y1+y2)/2 + 0.22, text, color);
}

// ===================== 场景状态 =====================
let PARAM_NAME = null;
function buildScene(pval){
    const env = {p: pval};
    if (PARAM_NAME) env[PARAM_NAME] = pval;
    (BOARD.scalars||[]).forEach(s=>{ env[s.name] = evalExpr(s.expr, env); });
    const sc2 = BOARD.scene || {};
    const out = {kind: sc2.kind, env, raw:{}};
    // 把场景各数值字段（可为表达式）按 env 解析
    for (const k in sc2){
        if (k === 'kind') continue;
        const v = sc2[k];
        out.raw[k] = v;
        if (typeof v === 'number') out[k] = v;
        else if (typeof v === 'string'){ const v2 = evalExpr(v, env); out[k] = isFinite(v2) ? v2 : v; }
        else if (Array.isArray(v)) out[k] = v.map(z => (typeof z==='string')? evalExpr(z,env) : z);
        else out[k] = v;
    }
    return out;
}
// ===================== 场景绘制 =====================
let animT = 0;                                    // 动画时钟（秒，电流/水流用）

// ---- 1) 杠杆 ----
function drawLever(S){
    const [px,py]=S.pivot, half=S.beamLen/2;
    const th=(S.tilt||0)*Math.PI/180, ux=Math.cos(th), uy=Math.sin(th);
    const d1=isFinite(S.d1)?S.d1:S.L1, d2=isFinite(S.d2)?S.d2:S.L2;   // 绘图臂长（可与真实值不同比例）
    const fs1=isFinite(S.fs1)?S.fs1:(S.fScale||0.05), fs2=isFinite(S.fs2)?S.fs2:(S.fScale||0.05);
    groundLine(py-0.62, 0.4, view.xRange[1]-0.4);
    // 支点三角
    ctx.fillStyle=col('metal');
    ctx.beginPath(); ctx.moveTo(SX(px),SY(py)); ctx.lineTo(SX(px-0.35),SY(py-0.55));
    ctx.lineTo(SX(px+0.35),SY(py-0.55)); ctx.closePath(); ctx.fill();
    // 杠杆棒
    const lx=px-half*ux, ly=py-half*uy, rx=px+half*ux, ry=py+half*uy;
    ctx.strokeStyle='#e2e8f0'; ctx.lineWidth=8; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(SX(lx),SY(ly)); ctx.lineTo(SX(rx),SY(ry)); ctx.stroke();
    ctx.lineCap='butt';
    // 左端动力 F1（真实力臂 L1）
    const p1x=px-d1*ux, p1y=py-d1*uy;
    const a1=Math.min(S.F1*fs1, 1.6);
    arrow(p1x, p1y+0.12, p1x, p1y+0.12+a1, 'effort', 3, 'F₁='+fmt(S.F1,1)+'N');
    dimLine(px, py-0.28, p1x, p1y-0.28, 'L₁='+fmt(S.L1,2)+'m');
    // 右端阻力 F2 + 重物
    const p2x=px+d2*ux, p2y=py+d2*uy;
    rectBox(p2x-0.4, p2y, 0.8, 0.55, col('load'), '#0f172a');
    label(p2x, p2y+0.28, 'G', '#0f172a', 'center', 12);
    const a2=Math.min(S.F2*fs2, 1.6);
    arrow(p2x, p2y-0.62, p2x, p2y-0.62-a2, 'force', 3, 'F₂='+fmt(S.F2,1)+'N');
    dimLine(px, py-0.5, p2x, p2y-0.5, 'L₂='+fmt(S.L2,2)+'m');
    label(px, py-0.95, 'O', '#e2e8f0', 'center', 13);
}

// ---- 2) 压强（海绵下陷） ----
function drawPressure(S){
    const gy=0.9, sw=5.0, sh=0.9, cx=(view.xRange[0]+view.xRange[1])/2;
    const sink=Math.max(0, Math.min(S.sink, sh*0.85));
    // 桌面
    groundLine(gy-0.02, cx-sw/2-0.6, cx+sw/2+0.6);
    // 海绵（顶面在盒宽范围内下陷 sink）
    const bw=S.boxW, top=gy+sh;
    ctx.fillStyle=col('sponge'); ctx.beginPath();
    ctx.moveTo(SX(cx-sw/2), SY(gy));
    ctx.lineTo(SX(cx-sw/2), SY(top));
    ctx.quadraticCurveTo(SX(cx-bw/2-0.35), SY(top-sink*0.25), SX(cx-bw/2), SY(top-sink));
    ctx.lineTo(SX(cx+bw/2), SY(top-sink));
    ctx.quadraticCurveTo(SX(cx+bw/2+0.35), SY(top-sink*0.25), SX(cx+sw/2), SY(top));
    ctx.lineTo(SX(cx+sw/2), SY(gy));
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle='#065f46'; ctx.lineWidth=1.5; ctx.stroke();
    // 方块
    const boxH=S.boxH||0.85, boxTop=top-sink+boxH;
    rectBox(cx-bw/2, top-sink, bw, boxH, col('obj'), '#0f172a');
    label(cx, top-sink+boxH/2, S.boxLabel||'', '#0f172a', 'center', 12);
    // 压力箭头 + 下陷标注
    arrow(cx, boxTop+0.9, cx, boxTop+0.08, 'force', 3, 'F='+fmt(S.F,1)+'N');
    if (sink>0.06) dimLine(cx+bw/2+0.45, top, cx+bw/2+0.45, top-sink, 'Δ='+fmt(S.sink/S.k,2)+'cm');
}

// ---- 3) 浮力（弹簧秤 + 浸入） ----
function drawBuoyancy(S){
    const tx0=2.2, tx1=7.8, ty0=0.7, wall=4.4, liquidY=S.liquidY;
    // 容器
    ctx.strokeStyle=col('metal'); ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(SX(tx0),SY(wall)); ctx.lineTo(SX(tx0),SY(ty0));
    ctx.lineTo(SX(tx1),SY(ty0)); ctx.lineTo(SX(tx1),SY(wall)); ctx.stroke();
    // 水
    ctx.fillStyle='rgba(56,189,248,0.30)';
    ctx.fillRect(SX(tx0)+2, SY(liquidY), (tx1-tx0)*sc-4, (liquidY-ty0)*sc);
    ctx.strokeStyle=col('water'); ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(SX(tx0),SY(liquidY)); ctx.lineTo(SX(tx1),SY(liquidY)); ctx.stroke();
    // 物体（部分浸入，浸没段加深）
    const ow=S.objW, oh=S.objH, ocx=(tx0+tx1)/2;
    const oTop=S.objTop, oBot=oTop-oh;
    const subTop=Math.min(oTop, liquidY), subBot=Math.max(oBot, ty0+0.05);
    rectBox(ocx-ow/2, oTop-oh, ow, oh, '#c4b5fd', '#0f172a');
    if (subTop>subBot) rectBox(ocx-ow/2, subBot, ow, subTop-subBot, '#7c3aed', '#0f172a');
    // 弹簧秤
    const scY=wall+1.15;
    rectBox(ocx-0.45, scY, 0.9, 0.7, '#e2e8f0', '#0f172a');
    label(ocx, scY+0.35, 'N', '#0f172a', 'center', 12);
    dashLine(ocx, scY, ocx, oTop, '#94a3b8', 2);
    // 箭头：G 向下、F浮 向上、F拉 向上
    arrow(ocx, oTop-oh/2, ocx, oTop-oh/2-Math.min(S.G*S.fScale,1.7), 'force', 3, 'G='+fmt(S.G,1)+'N');
    if (S.F_buoy>0.001)
        arrow(ocx, oBot+0.06, ocx, oBot+0.06+Math.min(S.F_buoy*S.fScale,1.7), 'water2', 3, 'F浮='+fmt(S.F_buoy,2)+'N');
    arrow(ocx+0.02, oTop+0.04, ocx+0.02, oTop+0.04+Math.min(S.F_scale*S.fScale,1.7), 'good', 3, 'F拉='+fmt(S.F_scale,2)+'N');
}

// ---- 4) 滑轮组（一动一定，n=2） ----
function drawPulley(S){
    const ceil=5.6, fx=5.0, fy=5.05, r=0.42;
    const my=S.my, mx=3.0;
    // 天花板
    ctx.strokeStyle=col('ground'); ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(SX(1.6),SY(ceil)); ctx.lineTo(SX(7.4),SY(ceil)); ctx.stroke();
    ctx.lineWidth=1.2;
    for (let x=1.7;x<7.4;x+=0.3){ ctx.beginPath(); ctx.moveTo(SX(x),SY(ceil)); ctx.lineTo(SX(x)-6,SY(ceil)+8); ctx.stroke(); }
    // 定滑轮轴 + 吊杆
    dashLine(fx, fy, fx, ceil, '#94a3b8', 3);
    // 绳子（锚点→动滑轮→定滑轮→手）
    const ax=2.2;
    const handY=S.handY;
    ctx.strokeStyle=col('rope'); ctx.lineWidth=2.5;
    ctx.beginPath();
    ctx.moveTo(SX(ax),SY(ceil));
    ctx.lineTo(SX(mx-0.18),SY(my));
    ctx.arc(SX(mx),SY(my), r*sc, Math.PI*1.06, Math.PI*1.94, false);   // 绕动滑轮下方
    ctx.lineTo(SX(fx-0.05),SY(fy));
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(SX(fx),SY(fy), r*sc, Math.PI*1.06, Math.PI*0.06+Math.PI, false); // 绕定滑轮上方（右半）
    ctx.stroke();
    ctx.beginPath(); ctx.moveTo(SX(fx+r),SY(fy)); ctx.lineTo(SX(fx+r+0.35),SY(handY)); ctx.stroke();
    // 滑轮轮子
    [[fx,fy],[mx,my]].forEach(([cx2,cy2])=>{
        ctx.fillStyle='#334155'; ctx.beginPath(); ctx.arc(SX(cx2),SY(cy2),r*sc,0,7); ctx.fill();
        ctx.strokeStyle=col('metal'); ctx.lineWidth=3; ctx.stroke();
        ctx.fillStyle=col('metal'); ctx.beginPath(); ctx.arc(SX(cx2),SY(cy2),3.5,0,7); ctx.fill();
    });
    // 重物 + G 箭头
    rectBox(mx-0.55, my-r-1.05, 1.1, 0.75, col('load'), '#0f172a');
    label(mx, my-r-0.68, 'G', '#0f172a', 'center', 12);
    arrow(mx, my-r-1.1, mx, my-r-1.1-Math.min(S.G*S.fScale,1.5), 'force', 3, 'G='+fmt(S.G,0)+'N');
    // 拉力箭头（手）
    arrow(fx+r+0.35, handY, fx+r+0.35, handY-Math.min(S.F*S.fScale,1.5), 'effort', 3, 'F='+fmt(S.F,1)+'N');
    // 提升高度标注
    if (S.h>0.01) dimLine(mx+0.95, S.myBase, mx+0.95, my, 'h='+fmt(S.h,2)+'m');
    label(fx, fy-0.62, 'n='+S.n, '#94a3b8', 'center', 12);
}

// ---- 5) 电路图 ----
function wire(path, color=col('wire'), lw=2.5){
    ctx.strokeStyle=color; ctx.lineWidth=lw; ctx.lineJoin='round';
    ctx.beginPath(); path.forEach((p,i)=> i?ctx.lineTo(SX(p[0]),SY(p[1])):ctx.moveTo(SX(p[0]),SY(p[1]))); ctx.stroke();
}
function flowDots(path, speed, nDots, color){
    // 沿折线按弧长均匀布点，动画时钟推进（speed=0 则不动）
    const segs=[]; let total=0;
    for (let i=1;i<path.length;i++){ const d=Math.hypot(path[i][0]-path[i-1][0], path[i][1]-path[i-1][1]); segs.push(d); total+=d; }
    if (total<0.01) return;
    if (!nDots) nDots=Math.max(2, Math.round(total*1.6));
    ctx.fillStyle=color;
    for (let k=0;k<nDots;k++){
        let d=(((speed*animT) + k*total/nDots) % total + total) % total;
        for (let i=0;i<segs.length;i++){
            if (d<=segs[i]||i===segs.length-1){
                const f=segs[i]>0?d/segs[i]:0;
                const x=path[i][0]+(path[i+1][0]-path[i][0])*f, y=path[i][1]+(path[i+1][1]-path[i][1])*f;
                ctx.beginPath(); ctx.arc(SX(x),SY(y),3.2,0,7); ctx.fill(); break;
            }
            d-=segs[i];
        }
    }
}
function symBattery(x,y,vertical){     // 电池组：长短两横
    ctx.strokeStyle=col('battery'); ctx.fillStyle=col('battery');
    if (vertical){
        ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(SX(x-0.28),SY(y)); ctx.lineTo(SX(x+0.28),SY(y)); ctx.stroke();
        ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(SX(x-0.14),SY(y-0.26)); ctx.lineTo(SX(x+0.14),SY(y-0.26)); ctx.stroke();
    } else {
        ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(SX(x),SY(y-0.28)); ctx.lineTo(SX(x),SY(y+0.28)); ctx.stroke();
        ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(SX(x+0.26),SY(y-0.14)); ctx.lineTo(SX(x+0.26),SY(y+0.14)); ctx.stroke();
    }
}
function symBox(x,y,text,color){       // 电阻/开关等方框元件
    rectBox(x-0.36, y-0.2, 0.72, 0.4, '#1e293b', color, 2.5);
    label(x, y, text, color, 'center', 11);
}
function symMeter(x,y,letter){         // 电流表/电压表
    ctx.fillStyle='#0f172a'; ctx.strokeStyle=col('meter'); ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(SX(x),SY(y),0.3*sc,0,7); ctx.fill(); ctx.stroke();
    label(x, y, letter, col('meter'), 'center', 13);
}
function drawCircuit(S){
    const X0=1.2, X1=8.3, Y0=1.2, Y1=4.9;
    const par = S.layout==='parallel', single = S.layout==='single';
    const parts=[], flows=[];                        // parts: 静态线；flows: 带电流点的线
    // 主回路左半：电池→开关→上角
    if (!par && !single){
        parts.push([[X0,Y1],[3.4,Y1]]); parts.push([[4.1,Y1],[5.3,Y1]]); parts.push([[6.0,Y1],[X1,Y1]]);
        parts.push([[X1,Y1],[X1,Y0]]); parts.push([[X1,Y0],[X0,Y0],[X0,3.0]]);
        symBox(3.75,Y1,'R₁='+fmt(S.R1,1)+'Ω',col('battery'));
        symBox(5.65,Y1,'R₂='+fmt(S.R2,1)+'Ω',col('battery'));
        symMeter(X1,3.0,'A');
        // 电压表并联在 R1 两端
        parts.push([[3.05,Y1],[3.05,3.35]]); parts.push([[3.05,3.35],[4.45,3.35]]); parts.push([[4.45,3.35],[4.45,Y1]]);
        symMeter(3.75,3.35,'V');
        flows.push({path:[[X0,3.0],[X0,Y1],[3.4,Y1]], I:S.I});
        flows.push({path:[[4.1,Y1],[5.3,Y1]], I:S.I});
        flows.push({path:[[6.0,Y1],[X1,Y1],[X1,Y0],[X0,Y0]], I:S.I});
    } else if (single){
        // 单电阻：电池、开关、电阻、电流表；电压表并联在 R 两端
        parts.push([[X0,Y1],[3.6,Y1]]); parts.push([[5.4,Y1],[X1,Y1]]);
        parts.push([[X1,Y1],[X1,Y0]]); parts.push([[X1,Y0],[X0,Y0],[X0,3.0]]);
        symBox(4.5,Y1,'R='+fmt(S.R1,1)+'Ω',col('battery'));
        symMeter(X1,3.0,'A');
        parts.push([[3.25,Y1],[3.25,3.35]]); parts.push([[3.25,3.35],[5.75,3.35]]); parts.push([[5.75,3.35],[5.75,Y1]]);
        symMeter(4.5,3.35,'V');
        flows.push({path:[[X0,3.0],[X0,Y1],[3.6,Y1]], I:S.I});
        flows.push({path:[[5.4,Y1],[X1,Y1],[X1,Y0],[X0,Y0]], I:S.I});
    } else {
        // 并联：上下两支路
        parts.push([[X0,Y1],[2.6,Y1]]);
        parts.push([[2.6,Y1],[2.6,3.45]]); parts.push([[2.6,3.45],[6.6,3.45]]); parts.push([[6.6,3.45],[6.6,Y1]]);
        parts.push([[6.6,Y1],[X1,Y1]]); parts.push([[X1,Y1],[X1,Y0]]); parts.push([[X1,Y0],[X0,Y0],[X0,3.0]]);
        symBox(4.6,Y1,'L₁='+fmt(S.R1,1)+'Ω',col('battery'));
        symBox(4.6,3.45,'L₂='+fmt(S.R2,1)+'Ω',col('battery'));
        symMeter(X1,3.0,'A');
        flows.push({path:[[2.6,Y1],[6.6,Y1]], I:S.I1});
        flows.push({path:[[2.6,Y1],[2.6,3.45],[6.6,3.45],[6.6,Y1]], I:S.I2});
        flows.push({path:[[X0,Y1],[2.6,Y1]], I:S.I});
        flows.push({path:[[6.6,Y1],[X1,Y1],[X1,Y0],[X0,Y0],[X0,3.0]], I:S.I});
    }
    parts.forEach(p=>wire(p));
    const kf = isFinite(S.kflow) ? S.kflow : 1.5;
    flows.forEach(fl=>{ wire(fl.path); flowDots(fl.path, (isFinite(fl.I)?fl.I:0)*kf, 6, col('current')); });
    symBattery(X0,3.0,true);
    rectBox(X0-0.2,1.85,0.4,0.3,'#1e293b',col('good'),2.5);   // 开关（闭合）
    label(X0+0.75,2.0,'S',col('good'),'start',11);
    label((X0+X1)/2, Y0-0.35, par?'并联电路':(single?'单电阻电路':'串联电路'), '#64748b', 'center', 12);
}

// ===================== 渲染主入口 =====================
function render(){
    ctx.clearRect(0,0,cssW,cssH);
    const S = buildScene(curParam);
    switch(S.kind){
        case 'lever': drawLever(S); break;
        case 'pressure': drawPressure(S); break;
        case 'buoyancy': drawBuoyancy(S); break;
        case 'pulley': drawPulley(S); break;
        case 'circuit': drawCircuit(S); break;
    }
    updateReadouts(S);
}

// ===================== 读数 =====================
function updateReadouts(S){
    (BOARD.readouts||[]).forEach(r=>{
        const el=document.getElementById('ro-'+r.id);
        if (!el) return;
        try{
            if (r.type==='expr'){
                const v=evalExpr(r.expr, S.env);
                el.textContent=fmt(v, r.digits!=null?r.digits:2)+(r.unit?' '+r.unit:'');
            } else if (r.type==='status'){
                const v=evalExpr(r.expr, S.env), rhs=(r.rhs!=null?r.rhs:0), op=r.op||'>';
                const ok = op==='<'? v<rhs-1e-9 : op==='>'? v>rhs+1e-9 : op==='=='? Math.abs(v-rhs)<1e-6 : v>rhs-1e-9;
                el.textContent = ok?(r.okText||'满足'):(r.badText||'不满足');
                el.style.color = ok?'#059669':'#dc2626';
            }
        }catch(e){ el.textContent='—'; }
    });
    // 能量/功率条
    if (BOARD.bars){
        const a=evalExpr(BOARD.bars.a.expr, S.env), b=evalExpr(BOARD.bars.b.expr, S.env);
        const A=isFinite(a)&&a>0?a:0, B=isFinite(b)&&b>0?b:0, T=A+B||1;
        document.getElementById('bar-seg1').style.width=(A/T*100)+'%';
        document.getElementById('bar-seg2').style.width=(B/T*100)+'%';
        document.getElementById('bar-seg1').textContent=fmt(A,1);
        document.getElementById('bar-seg2').textContent=fmt(B,1);
    }
}

// ===================== 控制台构建 =====================
function renderKatex(el){ if (typeof renderMathInElement!=='undefined') renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}],throwOnError:false}); }
let curParam = BOARD.param ? (BOARD.param.value!==undefined?BOARD.param.value:BOARD.param.min) : 0;
function buildConsole(){
    document.getElementById('prob-title').textContent=(DATA.lesson&&DATA.lesson.title)||'';
    document.getElementById('prob-body').innerHTML=(DATA.lesson&&DATA.lesson.problem)||'';
    document.getElementById('scene-caption').textContent=(BOARD.scene&&BOARD.scene.caption)||'';
    const p=BOARD.param;
    if (p){
        document.getElementById('param-block').classList.remove('hidden');
        document.getElementById('param-label').innerHTML=(p.label||p.name)+' :';
        const s=document.getElementById('param-slider');
        s.min=p.min; s.max=p.max; s.step=p.step||0.5; s.value=curParam;
        document.getElementById('param-ticks').innerHTML=(p.ticks||[`${p.min}${p.unit||''}`,`${p.max}${p.unit||''}`]).map(t=>`<span>${t}</span>`).join('');
        s.addEventListener('input', ()=>{ curParam=parseFloat(s.value); syncParamVal(); render(); });
        syncParamVal();
    }
    document.getElementById('readouts').innerHTML=(BOARD.readouts||[]).map(r=>{
        if (r.highlight) return `<div class="flex justify-between items-center pt-1"><span class="text-slate-800 font-semibold">${r.label}:</span><span id="ro-${r.id}" class="text-base font-bold bg-teal-50 text-teal-700 px-3 py-1 rounded-lg border border-teal-200">—</span></div>`;
        return `<div class="flex justify-between border-b border-dashed border-slate-200 pb-1"><span>${r.label}:</span><span id="ro-${r.id}" class="font-bold" style="color:${r.color?col(r.color):'#0f172a'}">—</span></div>`;
    }).join('');
    if (BOARD.bars){
        document.getElementById('bar-block').classList.remove('hidden');
        document.getElementById('bar-label').textContent=BOARD.bars.label||'';
        document.getElementById('bar-legend').innerHTML=
            `<span><span class="inline-block w-2 h-2 rounded-sm" style="background:#4f46e5"></span> ${BOARD.bars.a.label}</span>`+
            `<span><span class="inline-block w-2 h-2 rounded-sm" style="background:#0ea5e9"></span> ${BOARD.bars.b.label}</span>`;
    }
    if (BOARD.constant){ document.getElementById('constant-block').classList.remove('hidden');
        document.getElementById('constant-val').innerHTML='≡ '+(BOARD.constant.label||''); }
    const legend=document.getElementById('legend'); const items=[];
    (BOARD.legend||[]).forEach(it=> items.push(`<div class="flex items-center gap-2"><span class="w-3 h-3 inline-block rounded" style="background:${col(it.color)}"></span> ${it.text}</div>`));
    legend.innerHTML=items.join('');
    document.getElementById('solution-body').innerHTML=(DATA.steps||[]).map((st,i)=>{
        const no=String(i+1).padStart(2,'0');
        return `<div class="${i>0?'border-t border-slate-100 pt-5':''}">
            <div class="flex items-start gap-4 mb-3">
                <span class="w-7 h-7 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold font-mono text-sm flex-shrink-0">${no}</span>
                <h3 class="text-base font-bold text-slate-900 pt-0.5">${st.title||''}</h3>
            </div>
            <div class="prose max-w-none text-slate-700 leading-relaxed text-sm space-y-2">${st.content||''}</div>
        </div>`;
    }).join('');
    renderKatex(document.body);
}
function syncParamVal(){ document.getElementById('param-val').textContent = fmt(curParam,2)+((BOARD.param&&BOARD.param.unit)||''); }

// ===================== 主循环 =====================
function loop(now){ animT = now/1000; render(); requestAnimationFrame(loop); }
window.addEventListener('resize', resizeCanvas);
PARAM_NAME = (BOARD.param && /^[A-Za-z_$][\w$]*$/.test(BOARD.param.name||'')) ? BOARD.param.name : null;
buildConsole();
resizeCanvas();
requestAnimationFrame(loop);
</script>
