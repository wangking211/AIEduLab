<script type="application/json" id="lesson-data">__LESSON_DATA__</script>
<script>
"use strict";
// ===================== 数据装载 =====================
const DATA = JSON.parse(document.getElementById('lesson-data').textContent);
const BOARD = DATA.board || {};
const UI = Object.assign({
    consoleTitle: "动态控制台", solutionTitle: "详细解析", current: "当前:"
}, (DATA.lesson && DATA.lesson.ui) || {});

const COLORS = {
    force:'#f87171', effort:'#38bdf8', aux:'#94a3b8', label:'#e2e8f0',
    obj:'#a78bfa', load:'#fbbf24', rope:'#e2e8f0', water:'#38bdf8',
    water2:'#0ea5e9', sponge:'#34d399', ground:'#64748b', metal:'#cbd5e1',
    wire:'#94a3b8', current:'#22d3ee', battery:'#facc15', bulb:'#fde047',
    meter:'#f472b6', arrow:'#f87171', good:'#34d399', bad:'#f87171'
};
const col = c => (c && COLORS[c]) ? COLORS[c] : (c || '#e2e8f0');

// ===================== 安全表达式求值 =====================
// 表达式由 generate.py 生成（可信本地内容）：可用 @param 名(或别名 p)、+ - * / ^、
// 及 sqrt/abs/min/max/pow/sign/PI 等白名单函数。
const MATHENV = {sqrt:Math.sqrt, abs:Math.abs, min:Math.min, max:Math.max,
    pow:Math.pow, sign:Math.sign, floor:Math.floor, ceil:Math.ceil, PI:Math.PI, E:Math.E,
    sin:Math.sin, cos:Math.cos, tan:Math.tan, asin:Math.asin, acos:Math.acos, atan:Math.atan, exp:Math.exp, log:Math.log,
    // 概率技能新增：读数要显示组合数、排列数与正态覆盖率，基础 MATHENV 里没有。
    // 实现与 lib/prob_kernel.py 的 comb / perm / normal_cdf 语义一致（见内核自检）。
    fact:(n)=>{n=Math.round(n); let r=1; for(let i=2;i<=n;i++) r*=i; return r;},
    comb:(n,k)=>{n=Math.round(n); k=Math.round(k); if(k<0||k>n) return 0;
        let r=1; for(let i=0;i<k;i++) r=r*(n-i)/(i+1); return Math.round(r);},
    normcdf:(z)=>{ // Φ(z)=½(1+erf(z/√2))，erf 用 A&S 7.1.26 有理逼近。
        // 自变量必须是 z/√2（不是 z）—— 漏了这一步误差会到 3e-3，肉眼可见。
        const s=Math.sign(z), x=Math.abs(z)/Math.SQRT2, t=1/(1+0.3275911*x);
        const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);
        return 0.5*(1+s*y); }};
const _exprCache = {};
function evalExpr(expr, env){
    if (typeof expr !== 'string') return expr;
    const scope = Object.assign({}, MATHENV, env);
    const names = Object.keys(scope);
    const key = expr + '|' + names.join(',');
    let fn = _exprCache[key];
    if (!fn){ try { fn = Function(...names, '"use strict";return ('+expr.replace(/\^/g,'**')+');'); }
              catch(e){ fn = () => NaN; } _exprCache[key] = fn; }
    try { const v = fn(...names.map(n=>scope[n])); return (typeof v==='number') ? v : NaN; }
    catch(e){ return NaN; }
}
const resolveVal = (v, env) => (typeof v === 'string') ? evalExpr(v, env) : v;
function fmt(x, d=2){
    if (x === null || x === undefined || !isFinite(x)) return '—';
    let s = x.toFixed(d);
    if (s === '-' + (0).toFixed(d)) s = (0).toFixed(d);
    return s;
}

// ===================== 画布与世界坐标 =====================
const canvas = document.getElementById('math-canvas');
const ctx = canvas.getContext('2d');
let cssW = 0, cssH = 0, sc = 1, offX = 0, offY = 0;
const view = BOARD.view || {xRange:[0,10], yRange:[0,6]};
const SX = x => offX + x*sc;
const SY = y => offY - y*sc;

function resizeCanvas(){
    const rect = canvas.parentElement.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width*dpr; canvas.height = rect.height*dpr;
    canvas.style.width = rect.width+'px'; canvas.style.height = rect.height+'px';
    ctx.setTransform(1,0,0,1,0,0); ctx.scale(dpr,dpr);
    cssW = rect.width; cssH = rect.height;
    const spanX = view.xRange[1]-view.xRange[0], spanY = view.yRange[1]-view.yRange[0];
    sc = Math.min((rect.width-30)/spanX, (rect.height-30)/spanY);
    offX = rect.width/2 - ((view.xRange[0]+view.xRange[1])/2)*sc;
    offY = rect.height/2 + ((view.yRange[0]+view.yRange[1])/2)*sc;
    render();
}

// ===================== 绘制基元 =====================
function arrow(x1,y1,x2,y2,color,lw=2.5,label=null){
    const px1=SX(x1), py1=SY(y1), px2=SX(x2), py2=SY(y2);
    const dx=px2-px1, dy=py2-py1, L=Math.hypot(dx,dy);
    if (L < 4) return;
    const ang=Math.atan2(dy,dx), hl=Math.min(10, L*0.45);
    ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=lw;
    ctx.beginPath(); ctx.moveTo(px1,py1); ctx.lineTo(px2-hl*Math.cos(ang), py2-hl*Math.sin(ang)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(px2,py2);
    ctx.lineTo(px2-hl*Math.cos(ang-0.42), py2-hl*Math.sin(ang-0.42));
    ctx.lineTo(px2-hl*Math.cos(ang+0.42), py2-hl*Math.sin(ang+0.42));
    ctx.closePath(); ctx.fill();
    if (label){
        ctx.font='bold 12px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
        const mx=(px1+px2)/2, my=(py1+py2)/2;
        const ox=Math.cos(ang+Math.PI/2)*13, oy=Math.sin(ang+Math.PI/2)*13;
        ctx.fillText(label, mx+ox, my+oy);
    }
}
function label(x,y,text,color='#e2e8f0',align='center',size=12){
    ctx.font='bold '+size+'px system-ui'; ctx.textAlign=align; ctx.textBaseline='middle';
    ctx.fillStyle=color; ctx.fillText(text, SX(x), SY(y));
}
function dashLine(x1,y1,x2,y2,color='#94a3b8',lw=1.2){
    ctx.strokeStyle=color; ctx.lineWidth=lw; ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(SX(x1),SY(y1)); ctx.lineTo(SX(x2),SY(y2)); ctx.stroke();
    ctx.setLineDash([]);
}
function rectBox(x,y,w,h,fill,stroke=null,lw=1.5){
    ctx.fillStyle=fill;
    ctx.fillRect(SX(x), SY(y+h), w*sc, h*sc);
    if (stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw; ctx.strokeRect(SX(x), SY(y+h), w*sc, h*sc); }
}
function groundLine(y, x0, x1, color='#64748b'){
    ctx.strokeStyle=color; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(SX(x0),SY(y)); ctx.lineTo(SX(x1),SY(y)); ctx.stroke();
    ctx.lineWidth=1.2;
    for (let x=x0; x<x1; x+=0.28){
        ctx.beginPath(); ctx.moveTo(SX(x),SY(y)); ctx.lineTo(SX(x)-6,SY(y)+8); ctx.stroke();
    }
}
// 标尺线（标注长度 L 的辅助线：两端短横 + 虚线 + 中点标签）
function dimLine(x1,y1,x2,y2,text,color='#94a3b8'){
    dashLine(x1,y1,x2,y2,color);
    ctx.strokeStyle=color; ctx.lineWidth=1.5;
    const nx=(y2===y1)?0:0, ny=(x2===x1)?0:0;
    ctx.beginPath(); ctx.moveTo(SX(x1),SY(y1)-5+ny); ctx.lineTo(SX(x1),SY(y1)+5+ny); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(SX(x2),SY(y2)-5); ctx.lineTo(SX(x2),SY(y2)+5); ctx.stroke();
    label((x1+x2)/2, (y1+y2)/2 + 0.22, text, color);
}

// ===================== 场景状态 =====================
let PARAM_NAME = null;
function buildScene(pval){
    const env = {p: pval};
    if (PARAM_NAME) env[PARAM_NAME] = pval;
    (BOARD.scalars||[]).forEach(s=>{ env[s.name] = evalExpr(s.expr, env); });
    const sc2 = BOARD.scene || {};
    const out = {kind: sc2.kind, env, raw:{}};
    // 把场景各数值字段（可为表达式）按 env 解析
    for (const k in sc2){
        if (k === 'kind') continue;
        const v = sc2[k];
        out.raw[k] = v;
        if (typeof v === 'number') out[k] = v;
        else if (typeof v === 'string'){ const v2 = evalExpr(v, env); out[k] = isFinite(v2) ? v2 : v; }
        else if (Array.isArray(v)) out[k] = v.map(z => (typeof z==='string')? evalExpr(z,env) : z);
        else out[k] = v;
    }
    return out;
}
// ===================== 概率统计场景 =====================
// 注意：外壳的 loop() 会给 animT 赋值。在 "use strict" 下给未声明变量赋值会
// ReferenceError，所以这里必须声明（edu-physics-em 曾因此 8 页全报错）。
let animT = 0;

// ---- 与 lib/prob_kernel.py 的 lcg() **逐位一致**的 32 位线性同余发生器 ----
// 这是本技能「同源一致」的关键：模拟在浏览器里随滑块重跑，但用的随机序列
// 与内核那条完全相同（Math.imul 取 32 位乘法低位，>>>0 回绕，等价于 Python 的
// & 0xFFFFFFFF）。常量不得改动 —— 改了两边就不再同源。
function lcg(seed){
    let s = seed >>> 0;
    return function(){
        s = (Math.imul(1664525, s) + 1013904223) >>> 0;
        return s / 4294967296;
    };
}
function pfact(n){ n = Math.round(n); let r = 1; for (let i=2;i<=n;i++) r *= i; return r; }
function pcomb(n,k){
    n = Math.round(n); k = Math.round(k);
    if (k < 0 || k > n) return 0;
    let r = 1;
    for (let i=0;i<k;i++) r = r*(n-i)/(i+1);
    return Math.round(r);
}
// 标准正态累积 Φ(z) —— 用 A&S 7.1.26 的 erf 有理逼近（最大误差 ~1.5e-7，
// 远小于读数显示的 4 位小数）。内核用 C 实现的 math.erf，浏览器里没有，
// 故这里自带一份；两者在显示精度上一致。
function erfA(x){
    const s = Math.sign(x); x = Math.abs(x);
    const t = 1/(1+0.3275911*x);
    const y = 1 - (((((1.061405429*t - 1.453152027)*t) + 1.421413741)*t - 0.284496736)*t + 0.254829592)*t*Math.exp(-x*x);
    return s*y;
}
function normcdfJ(z){ return 0.5*(1 + erfA(z/Math.SQRT2)); }
function normpdfJ(z){ return Math.exp(-z*z/2)/Math.sqrt(2*Math.PI); }
const WSUB = '₀₁₂₃₄₅₆₇₈₉';
const wsub = n => String(n).split('').map(d => WSUB[+d]).join('');

// ---- 1) 排列组合：组合数 C(n,k) 随 k 的整排柱子 + 当前乘积式 ----
function drawFactor(S){
    const n = Math.round(S.n), k = Math.round(S.k);
    const cs = S.cs || [];
    const px0 = 1.0, px1 = 9.3, py0 = 1.6, py1 = 5.3;
    const cmax = Math.max.apply(null, cs.concat([1]));
    const dx = (px1-px0)/(n+1);
    const X = j => px0 + dx*(j+0.5);
    groundLine(py0, px0-0.25, px1+0.35, '#334155');
    label(px0-0.35, py1+0.42, '组合数 C('+n+',k) 随 k 的变化', '#94a3b8', 'start', 11);
    for (let j=0;j<=n;j++){
        const h = (cs[j]/cmax)*(py1-py0);
        const cur = (j===k);
        ctx.fillStyle = cur ? '#facc15' : '#818cf8';
        rectBox(X(j)-dx*0.30, py0, dx*0.60, Math.max(h,0.02), cur?'#facc15':'#818cf8');
        label(X(j), py0-0.26, String(j), '#64748b', 'center', 10);
    }
    // 对称性：C(n,k)=C(n,n-k)，柱子关于 k=n/2 对称
    if (n % 2 === 0){
        dashLine(X(n/2), py0-0.15, X(n/2), py1+0.30, '#475569', 1);
        label(X(n/2), py1+0.62, '关于 k='+(n/2)+' 对称', '#64748b', 'center', 10);
    }
    // 当前的乘积式（由 k 现算，不写死）
    let num = [];
    for (let i=0;i<k;i++) num.push(n-i);
    const expr = (k===0 ? '1' : num.join('×') + (k>0 ? ' / '+k+'!' : ''));
    label(5.1, 0.72, 'C('+n+','+k+') = '+expr+' = '+pcomb(n,k),
          '#facc15', 'center', 13);
    label(5.1, 0.28, 'P('+n+','+k+') = '+expr+' × '+k+'! = '+(pcomb(n,k)*pfact(k)),
          '#38bdf8', 'center', 12);
}

// ---- 2) 古典概型：两颗骰子的 6×6 样本空间，事件格着色 ----
function drawSample(S){
    const s = Math.round(S.s);
    const X0 = 2.0, Y0 = 0.55, cell = 0.56;
    const span = 6*cell;
    label(X0 + span/2, Y0 + span + 0.72, '两颗骰子点数和 = '+s, '#94a3b8', 'center', 12);
    for (let i=1;i<=6;i++)
        label(X0+(i-1)*cell+cell/2, Y0+span+0.30, String(i), '#64748b', 'center', 10);
    for (let j=1;j<=6;j++)
        label(X0-0.26, Y0+(j-1)*cell+cell/2, String(j), '#64748b', 'center', 10);
    label(X0-0.60, Y0+span/2, '第二颗 →(下)', '#475569', 'center', 9);
    let fav = 0;
    for (let i=1;i<=6;i++){
        for (let j=1;j<=6;j++){
            const hit = (i+j === s);
            if (hit) fav++;
            rectBox(X0+(i-1)*cell, Y0+(j-1)*cell, cell*0.94, cell*0.94,
                    hit ? '#facc15' : '#1e293b', hit ? '#fde68a' : '#334155', 1);
        }
    }
    const px = X0 + span + 0.45;
    label(px, Y0+span, '有利 ' + fav + ' 种', '#facc15', 'start', 12);
    label(px, Y0+span-0.42, '总数 36 种', '#94a3b8', 'start', 11);
    label(px, Y0+span-0.84, 'P = ' + fav + '/36', '#38bdf8', 'start', 12);
    label(px, Y0+span-1.24, '= ' + (fav/36).toFixed(4), '#38bdf8', 'start', 11);
}

// ---- 3) 贝叶斯：1000 人图标阵列（真患/漏检/假阳性 四色） ----
function drawBayes(S){
    const prev = S.prev, sens = S.sens, fpr = S.fpr;
    const N = Math.round(S.npop || 1000);
    const sick = Math.round(prev*N), healthy = N - sick;
    const tp = Math.round(sick*sens), fn = sick - tp;
    const fp = Math.round(healthy*fpr), tn = healthy - fp;
    const cols = 40, rows = Math.ceil(N/cols);
    const x0 = 0.60, y0 = 1.55, cell = 0.165;
    for (let idx=0; idx<N; idx++){
        const cx = x0 + (idx % cols)*cell;
        const cy = y0 + Math.floor(idx/cols)*cell;
        let col = '#334155';
        if (idx < tp) col = '#f87171';                 // 真患者，检测阳性
        else if (idx < sick) col = '#7f1d1d';          // 真患者，漏检
        else if (idx < sick + fp) col = '#fbbf24';     // 健康，假阳性
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.arc(SX(cx), SY(cy), 3.2, 0, 7); ctx.fill();
    }
    const ly = 0.95;
    const sw = (t,c,x)=>{ ctx.fillStyle=c; ctx.beginPath(); ctx.arc(SX(x),SY(ly),4.5,0,7); ctx.fill(); label(x+0.18, ly, t, '#cbd5e1', 'start', 10); };
    sw('真患·阳性 ' + tp, '#f87171', 0.70);
    sw('真患·漏检 ' + fn, '#7f1d1d', 3.20);
    sw('健康·假阳性 ' + fp, '#fbbf24', 5.70);
    sw('健康·阴性 ' + tn, '#334155', 8.20);
    label(9.9, 5.55, '每 1000 人', '#94a3b8', 'end', 11);
    // 阳性总人数与其中真患比例 —— 图与读数同源
    const posTotal = tp + fp;
    label(9.9, 5.15, '阳性共 ' + posTotal + ' 人，其中真患病 ' + tp + ' 人',
          '#e2e8f0', 'end', 11);
    label(9.9, 4.75, 'P(患病|阳性) ≈ ' + (posTotal ? (tp/posTotal).toFixed(4) : '—'),
          '#38bdf8', 'end', 12);
}

// ---- 4) 离散分布：二项 / 超几何的 pmf 柱子 + 期望与 ±σ ----
function hcomb(a,b){ return (b<0 || b>a) ? 0 : pcomb(a,b); }
function drawBars(S){
    const n = Math.round(S.n);
    const px0 = 0.85, px1 = 9.55, py0 = 0.95, py1 = 5.05;
    const dx = (px1-px0)/(n+1);
    const X = k => px0 + dx*(k+0.5);
    let pmf = [], mu, varp;
    if (S.dist === 'hyper'){
        const N = Math.round(S.N), K = Math.round(S.K);
        for (let k=0;k<=n;k++)
            pmf.push(hcomb(K,k)*hcomb(N-K,n-k)/hcomb(N,n));
        mu = n*K/N;
        varp = N > 1 ? n*(K/N)*(1-K/N)*(N-n)/(N-1) : 0;
    } else {
        const p = S.p;
        for (let k=0;k<=n;k++)
            pmf.push(pcomb(n,k)*Math.pow(p,k)*Math.pow(1-p,n-k));
        mu = n*p; varp = n*p*(1-p);
    }
    const sd = Math.sqrt(Math.max(varp,0));
    const pmax = Math.max.apply(null, pmf.concat([1e-9]));
    groundLine(py0, px0-0.25, px1+0.30, '#334155');
    // ±1σ 区间淡底
    ctx.fillStyle = 'rgba(56,189,248,0.10)';
    const xa = X(Math.max(0, mu-sd)), xb = X(Math.min(n, mu+sd));
    ctx.fillRect(SX(xa), SY(py1+0.35), (xb-xa), (py1+0.35-py0)*sc);
    for (let k=0;k<=n;k++){
        const h = (pmf[k]/pmax)*(py1-py0);
        const near = Math.abs(k-mu) <= sd + 1e-9;
        ctx.fillStyle = near ? '#38bdf8' : '#475569';
        rectBox(X(k)-dx*0.32, py0, dx*0.64, Math.max(h,0.015), ctx.fillStyle);
        if (n <= 14) label(X(k), py0-0.26, String(k), '#64748b', 'center', 9);
    }
    dashLine(px0, py0, px1, py0, '#334155', 1);
    // 期望竖线
    dashLine(X(mu), py0-0.12, X(mu), py1+0.35, '#facc15', 1.3);
    label(X(mu), py1+0.62, 'E(X)='+mu.toFixed(3), '#facc15', 'center', 11);
    label(px0-0.35, py1+0.62, S.dist==='hyper' ? '超几何分布' : '二项分布', '#94a3b8', 'start', 11);
    label(px1+0.15, py0-0.60, 'σ='+sd.toFixed(3), '#38bdf8', 'end', 11);
    label(5.0, 0.42, '蓝柱 = 落在 E(X)±σ 内的一半概率', '#64748b', 'center', 10);
}

// ---- 5) 正态分布：标准正态曲线 + |z|≤k 的阴影 + σ 参数 ----
function drawNormal(S){
    const k = S.k;
    const px0 = 0.70, px1 = 9.30, py = 1.15, H = 4.35;
    const xmin = -4, xmax = 4;
    const X = z => px0 + (z-xmin)/(xmax-xmin)*(px1-px0);
    const Y = d => py + d*H/0.42;
    // 坐标轴
    ctx.strokeStyle='#475569'; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(SX(px0),SY(py)); ctx.lineTo(SX(px1),SY(py)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(SX(X(0)),SY(py)); ctx.lineTo(SX(X(0)),SY(py+H/0.42*0.40)); ctx.stroke();
    for (let z=-4; z<=4; z++){
        ctx.strokeStyle='#334155'; ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(SX(X(z)),SY(py)); ctx.lineTo(SX(X(z)),SY(py-0.10)); ctx.stroke();
        label(X(z), py-0.30, (z===0?'0':String(z)), '#64748b', 'center', 10);
    }
    // 阴影：|z| ≤ k
    if (k > 0){
        ctx.fillStyle='rgba(56,189,248,0.28)';
        ctx.beginPath(); ctx.moveTo(SX(X(-k)), SY(Y(0)));
        for (let i=0;i<=160;i++){ const z=-k + 2*k*i/160; ctx.lineTo(SX(X(z)), SY(Y(normpdfJ(z)))); }
        ctx.lineTo(SX(X(k)), SY(Y(0))); ctx.closePath(); ctx.fill();
    }
    // 曲线
    ctx.strokeStyle='#818cf8'; ctx.lineWidth=2.6; ctx.beginPath();
    for (let i=0;i<=400;i++){
        const z = xmin + (xmax-xmin)*i/400;
        i===0 ? ctx.moveTo(SX(X(z)),SY(Y(normpdfJ(z)))) : ctx.lineTo(SX(X(z)),SY(Y(normpdfJ(z))));
    }
    ctx.stroke();
    // ±k 竖线与标签
    [-k,k].forEach(z=>{
        dashLine(X(z), py, X(z), Y(normpdfJ(z)), '#38bdf8', 1.4);
        label(X(z), Y(normpdfJ(z))+0.26, 'z='+(z>=0?'+':'')+z.toFixed(2), '#38bdf8', 'center', 11);
    });
    label(px0-0.30, py+H/0.42*0.40+0.30, '标准正态曲线 φ(z)', '#94a3b8', 'start', 11);
    // σ 经验值参考线（1σ/2σ/3σ 的覆盖率，解析值）
    label(9.85, 5.62, '1σ 68.27%   2σ 95.45%   3σ 99.73%', '#64748b', 'end', 10);
    const area = normcdfJ(k) - normcdfJ(-k);
    label(9.85, 5.20, 'P(|Z| ≤ ' + k.toFixed(2) + ') = ' + area.toFixed(4), '#38bdf8', 'end', 12);
}

// ---- 6) 大数定律：相对频率的真实轨迹（LCG 真跑，与内核同一条随机带） ----
function drawLln(S){
    const p = S.p, nmax = Math.round(S.nmax), seed = Math.round(S.seed);
    const px0 = 0.95, px1 = 9.45, py0 = 0.95, py1 = 5.35;
    const X = i => px0 + (i-1)/Math.max(nmax-1,1)*(px1-px0);
    const Y = v => py0 + Math.max(0, Math.min(1, v))*(py1-py0);
    // 真跑：这条轨迹是实际执行 LCG 得到的，不是画出来的
    const nxt = lcg(seed);
    const step = Math.max(1, Math.floor(nmax/620));   // 只影响抽样绘制密度，不影响数值
    const pts = [];
    let hits = 0;
    for (let i=1;i<=nmax;i++){
        if (nxt() < p) hits++;
        if (i % step === 0 || i === nmax) pts.push([i, hits/i]);
    }
    // 理论波动尺度 ±2/√n（不是数据，是解析包络，故用淡色虚线）
    ctx.strokeStyle='rgba(248,113,113,0.55)'; ctx.lineWidth=1.2; ctx.setLineDash([5,4]);
    for (const sgn of [1,-1]){
        ctx.beginPath();
        for (let j=0;j<=120;j++){
            const i = 1 + (nmax-1)*j/120;
            const v = p + sgn*2/Math.sqrt(i);
            j===0 ? ctx.moveTo(SX(X(i)),SY(Y(v))) : ctx.lineTo(SX(X(i)),SY(Y(v)));
        }
        ctx.stroke();
    }
    ctx.setLineDash([]);
    // 真实轨迹
    ctx.strokeStyle='#34d399'; ctx.lineWidth=2.2; ctx.beginPath();
    pts.forEach(([i,v],idx)=> idx===0 ? ctx.moveTo(SX(X(i)),SY(Y(v))) : ctx.lineTo(SX(X(i)),SY(Y(v))));
    ctx.stroke();
    // p 的水平渐近线
    dashLine(px0, Y(p), px1, Y(p), '#facc15', 1.6);
    // 标签放左侧：放右侧用 start 对齐会顶出画布（这里曾被裁边检查抓到）
    label(px0+0.08, Y(p)+0.30, 'p='+p.toFixed(2), '#facc15', 'start', 12);
    // 轴线
    ctx.strokeStyle='#475569'; ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.moveTo(SX(px0),SY(py0)); ctx.lineTo(SX(px1),SY(py0)); ctx.stroke();
    label(px0-0.30, py0, '0', '#64748b', 'center', 10);
    label(px0-0.30, py1, '1', '#64748b', 'center', 10);
    label(px0-0.30, (py0+py1)/2, '频率', '#64748b', 'center', 10);
    const last = pts.length ? pts[pts.length-1][1] : p;
    label(9.85, 5.62, '红虚线 = p ± 2/√n（理论波动尺度）', '#f87171', 'end', 10);
    label(9.85, 5.22, nmax.toLocaleString() + ' 次后频率 = ' + last.toFixed(4), '#34d399', 'end', 12);
}

// ---- 7) 中心极限定理：n 个均匀和的 z 分数直方图 + 标准正态叠加 ----
function drawClt(S){
    const n = Math.round(S.n), trials = Math.round(S.trials), maxn = Math.round(S.maxn);
    const seed = Math.round(S.seed);
    const mu = n*0.5, sd = Math.sqrt(n/12);
    const px0 = 0.80, px1 = 9.40, py0 = 1.05, py1 = 5.25;
    // 真跑：同一条扁平随机带按下标切片求和（改 n 不换随机数，前后可比）
    const nxt = lcg(seed);
    const flat = new Array(trials*maxn);
    for (let t=0;t<trials*maxn;t++) flat[t] = nxt();
    const B = 33, lo = -4, hi = 4, w = (hi-lo)/B;
    const cnt = new Array(B).fill(0);
    for (let t=0;t<trials;t++){
        let s = 0;
        for (let j=0;j<n;j++) s += flat[t*maxn + j];
        const z = (s-mu)/(sd || 1);
        const idx = Math.floor((z-lo)/w);
        if (idx>=0 && idx<B) cnt[idx]++;
    }
    const cmax = Math.max.apply(null, cnt.concat([1]));
    const X = z => px0 + (z-lo)/(hi-lo)*(px1-px0);
    const bw = (px1-px0)/B;
    for (let b=0;b<B;b++){
        const h = (cnt[b]/cmax)*(py1-py0);
        ctx.fillStyle = '#6366f1';
        rectBox(px0 + b*bw + bw*0.08, py0, bw*0.84, Math.max(h,0.01), '#6366f1');
    }
    groundLine(py0, px0-0.15, px1+0.15, '#334155');
    // 叠加标准正态（解析）
    ctx.strokeStyle='#facc15'; ctx.lineWidth=2.4; ctx.beginPath();
    const Y = d => py0 + d*(py1-py0)*(cmax/Math.max(trials*w,1));
    for (let i=0;i<=300;i++){
        const z = lo + (hi-lo)*i/300;
        i===0 ? ctx.moveTo(SX(X(z)),SY(Y(normpdfJ(z)))) : ctx.lineTo(SX(X(z)),SY(Y(normpdfJ(z))));
    }
    ctx.stroke();
    for (let z=-4; z<=4; z++)
        label(X(z), py0-0.28, (z===0?'0':String(z)), '#64748b', 'center', 10);
    label(px0-0.25, py0-0.62, 'z = (和 − n/2) / √(n/12) 的分布', '#94a3b8', 'start', 11);
    label(9.85, 5.62, '黄线 = 标准正态（解析）', '#facc15', 'end', 10);
    label(9.85, 5.22, 'n=' + n + '：超额峰度 = ' + (-6/(5*n)).toFixed(4) + '（→0 即正态）',
          '#38bdf8', 'end', 11);
}
function render(){
    ctx.clearRect(0,0,cssW,cssH);
    const S = buildScene(curParam);
    switch(S.kind){
        case 'factor': drawFactor(S); break;
        case 'sample': drawSample(S); break;
        case 'bayes':  drawBayes(S);  break;
        case 'bars':   drawBars(S);   break;
        case 'normal': drawNormal(S); break;
        case 'lln':    drawLln(S);    break;
        case 'clt':    drawClt(S);    break;
    }
    updateReadouts(S);
}

// ===================== 读数 =====================
function updateReadouts(S){
    (BOARD.readouts||[]).forEach(r=>{
        const el=document.getElementById('ro-'+r.id);
        if (!el) return;
        try{
            if (r.type==='expr'){
                const v=evalExpr(r.expr, S.env);
                el.textContent=fmt(v, r.digits!=null?r.digits:2)+(r.unit?' '+r.unit:'');
            } else if (r.type==='status'){
                const v=evalExpr(r.expr, S.env), rhs=(r.rhs!=null?r.rhs:0), op=r.op||'>';
                const ok = op==='<'? v<rhs-1e-9 : op==='>'? v>rhs+1e-9 : op==='=='? Math.abs(v-rhs)<1e-6 : v>rhs-1e-9;
                el.textContent = ok?(r.okText||'满足'):(r.badText||'不满足');
                el.style.color = ok?'#059669':'#dc2626';
            }
        }catch(e){ el.textContent='—'; }
    });
    // 能量/功率条
    if (BOARD.bars){
        const a=evalExpr(BOARD.bars.a.expr, S.env), b=evalExpr(BOARD.bars.b.expr, S.env);
        const A=isFinite(a)&&a>0?a:0, B=isFinite(b)&&b>0?b:0, T=A+B||1;
        document.getElementById('bar-seg1').style.width=(A/T*100)+'%';
        document.getElementById('bar-seg2').style.width=(B/T*100)+'%';
        document.getElementById('bar-seg1').textContent=fmt(A,1);
        document.getElementById('bar-seg2').textContent=fmt(B,1);
    }
}

// ===================== 控制台构建 =====================
function renderKatex(el){ if (typeof renderMathInElement!=='undefined') renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}],throwOnError:false}); }
let curParam = BOARD.param ? (BOARD.param.value!==undefined?BOARD.param.value:BOARD.param.min) : 0;
function buildConsole(){
    document.getElementById('prob-title').textContent=(DATA.lesson&&DATA.lesson.title)||'';
    document.getElementById('prob-body').innerHTML=(DATA.lesson&&DATA.lesson.problem)||'';
    document.getElementById('scene-caption').textContent=(BOARD.scene&&BOARD.scene.caption)||'';
    const p=BOARD.param;
    if (p){
        document.getElementById('param-block').classList.remove('hidden');
        document.getElementById('param-label').innerHTML=(p.label||p.name)+' :';
        const s=document.getElementById('param-slider');
        s.min=p.min; s.max=p.max; s.step=p.step||0.5; s.value=curParam;
        document.getElementById('param-ticks').innerHTML=(p.ticks||[`${p.min}${p.unit||''}`,`${p.max}${p.unit||''}`]).map(t=>`<span>${t}</span>`).join('');
        s.addEventListener('input', ()=>{ curParam=parseFloat(s.value); syncParamVal(); render(); });
        syncParamVal();
    }
    document.getElementById('readouts').innerHTML=(BOARD.readouts||[]).map(r=>{
        if (r.highlight) return `<div class="flex justify-between items-center pt-1"><span class="text-slate-800 font-semibold">${r.label}:</span><span id="ro-${r.id}" class="text-base font-bold bg-teal-50 text-teal-700 px-3 py-1 rounded-lg border border-teal-200">—</span></div>`;
        return `<div class="flex justify-between border-b border-dashed border-slate-200 pb-1"><span>${r.label}:</span><span id="ro-${r.id}" class="font-bold" style="color:${r.color?col(r.color):'#0f172a'}">—</span></div>`;
    }).join('');
    if (BOARD.bars){
        document.getElementById('bar-block').classList.remove('hidden');
        document.getElementById('bar-label').textContent=BOARD.bars.label||'';
        document.getElementById('bar-legend').innerHTML=
            `<span><span class="inline-block w-2 h-2 rounded-sm" style="background:#4f46e5"></span> ${BOARD.bars.a.label}</span>`+
            `<span><span class="inline-block w-2 h-2 rounded-sm" style="background:#0ea5e9"></span> ${BOARD.bars.b.label}</span>`;
    }
    if (BOARD.constant){ document.getElementById('constant-block').classList.remove('hidden');
        document.getElementById('constant-val').innerHTML='≡ '+(BOARD.constant.label||''); }
    const legend=document.getElementById('legend'); const items=[];
    (BOARD.legend||[]).forEach(it=> items.push(`<div class="flex items-center gap-2"><span class="w-3 h-3 inline-block rounded" style="background:${col(it.color)}"></span> ${it.text}</div>`));
    legend.innerHTML=items.join('');
    document.getElementById('solution-body').innerHTML=(DATA.steps||[]).map((st,i)=>{
        const no=String(i+1).padStart(2,'0');
        return `<div class="${i>0?'border-t border-slate-100 pt-5':''}">
            <div class="flex items-start gap-4 mb-3">
                <span class="w-7 h-7 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold font-mono text-sm flex-shrink-0">${no}</span>
                <h3 class="text-base font-bold text-slate-900 pt-0.5">${st.title||''}</h3>
            </div>
            <div class="prose max-w-none text-slate-700 leading-relaxed text-sm space-y-2">${st.content||''}</div>
        </div>`;
    }).join('');
    renderKatex(document.body);
}
function syncParamVal(){ document.getElementById('param-val').textContent = fmt(curParam,2)+((BOARD.param&&BOARD.param.unit)||''); }

// ===================== 主循环 =====================
function loop(now){ animT = now/1000; render(); requestAnimationFrame(loop); }
window.addEventListener('resize', resizeCanvas);
PARAM_NAME = (BOARD.param && /^[A-Za-z_$][\w$]*$/.test(BOARD.param.name||'')) ? BOARD.param.name : null;
buildConsole();
resizeCanvas();
requestAnimationFrame(loop);
</script>
