<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>细胞结构 3D 互动学习</title>
<style>__TAILWIND_CSS__</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
<style>
    body { font-family: "PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
    #viewport { position:absolute; inset:0; }
    .scroll-thin::-webkit-scrollbar { width:6px; }
    .scroll-thin::-webkit-scrollbar-thumb { background:#475569; border-radius:3px; }
    .step-item { cursor:pointer; transition:.15s; }
    .step-item:hover { background:rgba(45,212,191,.12); }
    .step-item.active { background:rgba(45,212,191,.20); border-color:#2dd4bf; }
    .katex-display { overflow-x:auto; overflow-y:hidden; }
</style>
</head>
<body class="bg-slate-100 text-slate-900">
<div class="flex h-screen overflow-hidden">
    <!-- 左：讲解 + 结构清单 + 对比表 -->
    <aside class="w-[32%] min-w-[340px] max-w-[460px] bg-white border-r border-slate-200 flex flex-col">
        <div class="px-5 py-4 border-b border-slate-200">
            <div class="text-[11px] uppercase tracking-wider text-teal-600 font-bold mb-1" id="eyebrow">细胞结构 · 3D 互动</div>
            <h1 id="cell-title" class="text-lg font-bold text-slate-900 leading-snug"></h1>
            <div id="cell-sub" class="text-xs text-slate-500 mt-1"></div>
        </div>
        <div class="px-5 py-3 border-b border-slate-200 bg-slate-50">
            <div class="flex items-center justify-between mb-2">
                <div class="text-[11px] uppercase tracking-wider text-teal-700 font-bold">分步观察</div>
                <div class="flex gap-1">
                    <button id="prev-btn" class="text-[11px] border border-slate-300 rounded px-2 py-0.5 hover:bg-white">上一步</button>
                    <button id="next-btn" class="text-[11px] border border-slate-300 rounded px-2 py-0.5 hover:bg-white">下一步</button>
                    <button id="rot-btn" class="text-[11px] border border-teal-400 text-teal-700 rounded px-2 py-0.5 hover:bg-teal-50">暂停旋转</button>
                </div>
            </div>
            <div id="steps" class="space-y-1"></div>
        </div>
        <div class="flex-1 overflow-y-auto scroll-thin px-5 py-4">
            <div id="detail" class="mb-4"></div>
            <div id="compare-wrap" class="hidden">
                <div class="text-[11px] uppercase tracking-wider text-teal-700 font-bold mb-2">三种细胞对比</div>
                <div class="overflow-x-auto scroll-thin">
                    <table id="compare" class="text-[11px] border-collapse w-full"></table>
                </div>
            </div>
        </div>
    </aside>
    <!-- 右：3D 视口 -->
    <section class="flex-1 bg-slate-900 relative">
        <div id="viewport"></div>
        <div class="absolute top-3 left-4 text-[11px] uppercase tracking-wider text-teal-400 font-bold pointer-events-none">细胞 3D 模型</div>
        <div id="hint" class="absolute bottom-3 left-4 text-[11px] text-slate-400 pointer-events-none">拖拽旋转 · 滚轮缩放 · 右键平移</div>
        <div id="hotspot" class="absolute top-3 right-4 max-w-[240px] bg-slate-800/90 border border-slate-700 rounded-lg px-3 py-2 hidden">
            <div id="hs-title" class="text-sm font-bold text-teal-300"></div>
            <div id="hs-text" class="text-[11px] text-slate-300 leading-relaxed mt-1"></div>
        </div>
    </section>
</div>

<script type="application/json" id="cell-data">__CELL_DATA__</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById('cell-data').textContent);
const SCENE_BG = 0x0f172a;

// ===================== 渲染器 / 场景 =====================
const container = document.getElementById('viewport');
let scene, camera, renderer, controls, root;
let autoRotate = true;
const HIGH_COLOR = new THREE.Color(0x2dd4bf);

function init(){
    scene = new THREE.Scene();
    scene.background = new THREE.Color(SCENE_BG);
    camera = new THREE.PerspectiveCamera(45, container.clientWidth/container.clientHeight, 0.1, 200);
    camera.position.set(0, 1.5, 12);
    renderer = new THREE.WebGLRenderer({ antialias:true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.62));
    const key = new THREE.DirectionalLight(0xffffff, 0.85); key.position.set(6, 9, 8); scene.add(key);
    const fill = new THREE.DirectionalLight(0xbfe8ff, 0.42); fill.position.set(-7, -4, -6); scene.add(fill);
    const rim = new THREE.PointLight(0x2dd4bf, 0.55, 60); rim.position.set(-8, 6, -8); scene.add(rim);

    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; controls.dampingFactor = 0.08;
    controls.minDistance = 4; controls.maxDistance = 30;
    controls.target.set(0, 0, 0);

    root = new THREE.Group(); scene.add(root);
    buildCell(DATA);
    setStep(0);
    renderer.render(scene, camera);
    window.addEventListener('resize', onResize);
    requestAnimationFrame(animate);
}
function onResize(){
    const w = container.clientWidth, h = container.clientHeight;
    camera.aspect = w/h; camera.updateProjectionMatrix(); renderer.setSize(w, h);
}
function animate(){
    requestAnimationFrame(animate);
    if (autoRotate) root.rotation.y += 0.0035;
    controls.update();
    renderer.render(scene, camera);
}

// ===================== 标签（canvas 贴图精灵） =====================
function makeLabel(text, color){
    const pad = 12, fs = 44;
    const c = document.createElement('canvas'); const g = c.getContext('2d');
    g.font = 'bold '+fs+'px "PingFang SC","Microsoft YaHei",sans-serif';
    const w = g.measureText(text).width;
    c.width = Math.ceil(w + pad*2); c.height = fs + pad*1.2;
    const g2 = c.getContext('2d');
    g2.font = 'bold '+fs+'px "PingFang SC","Microsoft YaHei",sans-serif';
    g2.textAlign='center'; g2.textBaseline='middle';
    g2.fillStyle = 'rgba(15,23,42,0.82)';
    const r = c.height/2;
    g2.beginPath();
    g2.moveTo(r,0); g2.lineTo(c.width-r,0); g2.arcTo(c.width,0,c.width,r,r);
    g2.lineTo(c.width,c.height-r); g2.arcTo(c.width,c.height,c.width-r,c.height,r);
    g2.lineTo(r,c.height); g2.arcTo(0,c.height,0,c.height-r,r);
    g2.lineTo(0,r); g2.arcTo(0,0,r,0,r); g2.fill();
    g2.fillStyle = color || '#e2e8f0';
    g2.fillText(text, c.width/2, c.height/2+2);
    const tex = new THREE.CanvasTexture(c);
    tex.minFilter = THREE.LinearFilter;
    const mat = new THREE.SpriteMaterial({ map:tex, transparent:true, depthTest:false });
    const sp = new THREE.Sprite(mat);
    const scale = 0.0055;
    sp.scale.set(c.width*scale, c.height*scale, 1);
    return sp;
}

// ===================== 几何构建 =====================
// 注意：每次调用都新建 material（不缓存）。若共享材质，高亮某个细胞器时
// 会因 traverse 改 opacity 而串扰到颜色/透明度相同的其他细胞器。
function mat(color, opacity, wireframe){
    return new THREE.MeshStandardMaterial({
        color:new THREE.Color(color), transparent: true, opacity:opacity,
        roughness:0.62, metalness:0.06, wireframe:!!wireframe,
        side: THREE.DoubleSide, depthWrite: opacity>=0.9 });
}
function ellipsoid(rx, ry, rz, color, opacity, seg=36, back=false){
    const g = new THREE.SphereGeometry(1, seg, Math.round(seg*0.7));
    const m = new THREE.Mesh(g, back ? matBack(color, opacity) : mat(color, opacity));
    m.scale.set(rx, ry, rz);
    return m;
}
// 细胞膜/壁专用：背面 + 无光照的淡壳 → 只看到"内壁"，前面不挡视线，也不会被灯光照亮成灰块
function matBack(color, opacity){
    return new THREE.MeshBasicMaterial({
        color:new THREE.Color(color), transparent:true, opacity:opacity,
        side: THREE.BackSide, depthWrite:false });
}

function buildOrganelle(o){
    const grp = new THREE.Group();
    const s = Array.isArray(o.size) ? o.size : [o.size];
    switch(o.geom){
        case 'sphere':
            grp.add(ellipsoid(s[0], s[0], s[0], o.color, o.opacity!=null?o.opacity:1));
            break;
        case 'ellipsoid':
            grp.add(ellipsoid(s[0], s[1], s[1], o.color, o.opacity!=null?o.opacity:1));
            break;
        case 'capsule': {                       // 线粒体：椭球 + 内部嵴
            const rx = s[0], ry = s[1];
            grp.add(ellipsoid(rx, ry, ry, o.color, o.opacity!=null?o.opacity:0.95));
            const inner = new THREE.Group();
            for (let i=-2;i<=2;i++){
                const w = Math.sqrt(Math.max(0, 1-(i/2.6)**2))*ry*1.5;
                const disc = new THREE.Mesh(new THREE.TorusGeometry(w*0.62, ry*0.10, 8, 24),
                                            mat('#f7d9cf', 0.95));
                disc.rotation.y = Math.PI/2;
                disc.position.x = i*rx*0.30;
                inner.add(disc);
            }
            grp.add(inner);
            break;
        }
        case 'grana': {                          // 叶绿体：椭球 + 基粒（圆盘堆）
            const rx = s[0], ry = s[1];
            grp.add(ellipsoid(rx, ry, ry*0.72, o.color, o.opacity!=null?o.opacity:0.92));
            const inner = new THREE.Group();
            const spots = [[-0.45,0.10],[0.0,-0.14],[0.42,0.12]];
            spots.forEach((p)=>{
                const stack = new THREE.Group();
                for (let j=0;j<4;j++){
                    const d = new THREE.Mesh(new THREE.CylinderGeometry(ry*0.46, ry*0.46, ry*0.07, 20),
                                             mat('#1c3d24', 0.96));
                    d.position.y = (j-1.5)*ry*0.13;
                    stack.add(d);
                }
                stack.position.set(p[0]*rx, p[1]*ry, 0);
                inner.add(stack);
            });
            grp.add(inner);
            break;
        }
        case 'disc_stack': {                      // 高尔基体：多层扁囊
            const rr = s[0], th = s[1];
            for (let i=0;i<5;i++){
                const rr2 = rr*(1 - 0.13*i);
                const d = new THREE.Mesh(new THREE.CylinderGeometry(rr2, rr2, th*0.55, 28), mat(o.color, 0.95));
                d.position.set(i*th*0.25, (i-2)*th*0.9, 0);
                d.rotation.z = 0.10*i;
                grp.add(d);
            }
            break;
        }
        case 'tube_bundle': {                     // 内质网：几条弯曲管道
            const L = s[0], rr = s[1];
            for (let i=0;i<4;i++){
                const curve = new THREE.CatmullRomCurve3([
                    new THREE.Vector3(-L*0.5, (i-1.5)*rr*0.42, 0),
                    new THREE.Vector3(-L*0.15, (i-1.5)*rr*0.42 + rr*0.30*Math.sin(i*1.7), rr*0.10),
                    new THREE.Vector3( L*0.20, (i-1.5)*rr*0.42 - rr*0.22, -rr*0.08),
                    new THREE.Vector3( L*0.5, (i-1.5)*rr*0.42 + rr*0.16, 0),
                ]);
                const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 40, rr*0.13, 8, false), mat(o.color, 0.92));
                grp.add(tube);
            }
            break;
        }
        case 'lobe': {                            // 细胞核：核膜 + 核质
            const rr = s[0];
            grp.add(ellipsoid(rr, rr*0.94, rr*0.96, o.color, 0.9));
            const env = ellipsoid(rr*1.06, rr*1.0, rr*1.02, '#c9b3e0', 0.20);
            grp.add(env);
            break;
        }
        case 'centriole': {                       // 中心体：两两垂直的短管束
            for (let g2=0; g2<2; g2++){
                const cyl = new THREE.Group();
                for (let i=0;i<9;i++){
                    const a = i/9*Math.PI*2;
                    const t = new THREE.Mesh(new THREE.CylinderGeometry(s[0]*0.10, s[0]*0.10, s[0]*1.05, 8), mat(o.color,0.95));
                    t.position.set(Math.cos(a)*s[0]*0.36, 0, Math.sin(a)*s[0]*0.36);
                    cyl.add(t);
                }
                cyl.rotation.z = g2===0 ? 0 : Math.PI/2;
                cyl.position.set(g2===0? -s[0]*0.5 : 0, 0, 0);
                grp.add(cyl);
            }
            break;
        }
        case 'dna_loop': {                        // 拟核：环状 DNA
            const rr = s[0];
            const loop = new THREE.Mesh(new THREE.TorusKnotGeometry(rr*0.72, rr*0.09, 120, 10, 2, 3), mat(o.color, 0.95));
            grp.add(loop);
            const back = new THREE.Mesh(new THREE.TorusGeometry(rr*0.55, rr*0.06, 10, 60), mat('#f59e0b', 0.85));
            back.rotation.x = 1.1; back.position.set(rr*0.1, -rr*0.15, 0);
            grp.add(back);
            break;
        }
        case 'rod': {                             // 鞭毛：细杆
            const L = s[0], rr = s[1];
            const rod = new THREE.Mesh(new THREE.CylinderGeometry(rr, rr*0.6, L, 10), mat(o.color, 0.95));
            rod.rotation.z = Math.PI/2;
            grp.add(rod);
            const tip = new THREE.Mesh(new THREE.SphereGeometry(rr*1.2, 10, 10), mat(o.color, 0.95));
            tip.position.set(-L/2, 0, 0); grp.add(tip);
            break;
        }
        default:
            grp.add(ellipsoid(s[0], s[0], s[0], o.color));
    }
    return grp;
}

function buildBoundary(b){
    // 策略：淡淡的"内壁"（BackSide + 无光照）＋ 稀疏线框勾出形状。
    // 线框段数刻意压低（球 16×10、盒 12 条棱），否则会在屏幕上糊成一片。
    const grp = new THREE.Group();
    const shellOpacity = Math.min(b.opacity == null ? 0.12 : b.opacity, 0.20);
    const isBox = (b.geom === 'box');
    const sz = Array.isArray(b.size) ? b.size : [b.size, b.size, b.size];
    if (shellOpacity > 0.03){
        const sh = isBox
            ? new THREE.Mesh(new THREE.BoxGeometry(sz[0]*2, sz[1]*2, sz[2]*2), matBack(b.color, shellOpacity))
            : ellipsoid(sz[0], sz[1], sz[2], b.color, shellOpacity, 40, true);
        sh.userData.baseOpacity = shellOpacity;
        grp.add(sh);
    }
    // 线框：盒用 12 条棱（干净利落，突出"方形"），球用稀疏经纬线
    const wfOp = isBox ? 0.28 : 0.11;
    const wfMat = new THREE.MeshBasicMaterial({
        color:new THREE.Color(b.color), wireframe:true, transparent:true, opacity:wfOp });
    const wf = isBox
        ? new THREE.Mesh(new THREE.BoxGeometry(sz[0]*2, sz[1]*2, sz[2]*2), wfMat)
        : new THREE.Mesh(new THREE.SphereGeometry(1, 16, 10), wfMat);
    if (!isBox) wf.scale.set(sz[0], sz[1], sz[2]);
    wf.userData.baseOpacity = wfOp;
    wf.userData.isWireframe = true;
    grp.add(wf);
    grp.userData.boundary = true;
    return grp;
}

// ===================== 组装细胞 =====================
const pickables = [];       // {mesh, orgId}
function buildCell(data){
    // 边界（由外到内，先画外层）
    data.boundary.forEach(b=>{
        const m = buildBoundary(b);
        m.userData.boundary = true;
        root.add(m);
    });
    // 细胞器
    data.organelles.forEach(o=>{
        const g = buildOrganelle(o);
        g.position.set(o.pos[0], o.pos[1], o.pos[2]);
        if (o.rot) g.rotation.set(o.rot[0], o.rot[1], o.rot[2]);
        g.userData.orgId = o.id;
        g.userData.baseOpacity = o.opacity!=null ? o.opacity : 1;
        root.add(g);
        // 每个细胞器挂一个标签（初始隐藏）
        const lbl = makeLabel(o.label, o.color);
        lbl.position.set(o.pos[0], o.pos[1] + (Array.isArray(o.size)? (o.size[1]||1) : o.size) + 0.55, o.pos[2]);
        lbl.userData.isLabel = true;          // 注意：用 isLabel 区分「这是标签」与「这个组有标签」
        lbl.userData.orgId = o.id;
        lbl.visible = false;
        root.add(lbl);
        // 收集可拾取网格
        g.traverse(ch=>{ if (ch.isMesh){ ch.userData.orgId = o.id; pickables.push({mesh:ch, id:o.id}); } });
    });
}

// ===================== 分步高亮 =====================
let curStep = 0;
function setStep(i){
    curStep = Math.max(0, Math.min(DATA.steps.length-1, i));
    const active = new Set(DATA.highlight[curStep] || []);
    const showAll = curStep === 0;
    root.children.forEach(ch=>{
        // 先处理标签精灵：只在「讲到该结构」时显示
        if (ch.userData.isLabel){
            ch.visible = (curStep > 0 && active.has(ch.userData.orgId));
            return;
        }
        const id = ch.userData.orgId;
        if (!id){
            // 边界 Group（淡壳 + 线框）：整体观察时清晰，看具体结构时压暗但不消失
            ch.traverse(m=>{
                if (!m.isMesh || !m.material || !m.material.transparent) return;
                const base = (m.userData.baseOpacity != null) ? m.userData.baseOpacity : 0.12;
                m.material.opacity = showAll ? base : base * (m.userData.isWireframe ? 1.0 : 0.4);
            });
            return;
        }
        const on = showAll || active.has(id);
        const base = ch.userData.baseOpacity != null ? ch.userData.baseOpacity : 1;
        ch.traverse(m=>{
            if (!m.isMesh || !m.material) return;
            m.material.opacity = on ? base : Math.min(base, 0.12);
            m.material.transparent = true;
            if (m.material.emissive){
                m.material.emissive = on ? new THREE.Color(0x113333) : new THREE.Color(0x000000);
            }
        });
        ch.scale.setScalar(on ? 1.0 : 0.97);
    });
    // 镜头
    const v = DATA.views[curStep];
    if (v){
        const from = camera.position.clone();
        const to = new THREE.Vector3(v.pos[0], v.pos[1], v.pos[2]);
        camera.position.copy(to);
        controls.target.set(v.target[0], v.target[1], v.target[2]);
        controls.update();
    }
    // 左侧步骤
    [...document.querySelectorAll('#steps .step-item')].forEach((el,k)=>el.classList.toggle('active', k===curStep));
    // 说明文字
    const names = (DATA.highlight[curStep]||[]).map(id=>{
        const o = DATA.organelles.find(x=>x.id===id); return o ? o.label : id;
    });
    const uniq = [...new Set(names)];
    const detail = document.getElementById('detail');
    if (curStep === 0){
        detail.innerHTML = `<div class="text-[13px] font-bold text-teal-700 mb-1">整体观察</div>
            <p class="text-sm text-slate-700 leading-relaxed">旋转观察这个细胞的整体形态。${DATA.kind==='plant'?'注意植物细胞呈方形、有细胞壁和中央大液泡。':DATA.kind==='prokaryotic'?'这是原核细胞：没有核膜包被的细胞核，只有拟核。':'注意动物细胞呈圆形、无细胞壁。'}点击右侧「下一步」逐个认识各结构。</p>`;
    } else {
        const items = uniq.map(name=>{
            const o = DATA.organelles.find(x=>x.label===name);
            return `<li class="mb-1.5"><b class="text-slate-900">${name}</b> — <span class="text-slate-600">${o?o.detail:''}</span></li>`;
        }).join('');
        detail.innerHTML = `<div class="text-[13px] font-bold text-teal-700 mb-1">${DATA.steps[curStep]}</div>
            <ul class="text-sm text-slate-700 leading-relaxed list-disc pl-4">${items}</ul>`;
    }
    document.getElementById('hotspot').classList.add('hidden');
    renderStats();
}
function renderStats(){
    document.getElementById('prev-btn').disabled = curStep===0;
    document.getElementById('prev-btn').style.opacity = curStep===0 ? .45 : 1;
    document.getElementById('next-btn').disabled = curStep===DATA.steps.length-1;
    document.getElementById('next-btn').style.opacity = curStep===DATA.steps.length-1 ? .45 : 1;
}

// ===================== 点击拾取 =====================
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
renderer_dom_click();
function renderer_dom_click(){
    // 在 init 之后绑定；用事件委托挂在 window 上，检查目标容器
    window.addEventListener('click', ev=>{
        if (!renderer || !renderer.domElement) return;
        const rect = renderer.domElement.getBoundingClientRect();
        if (ev.clientX < rect.left || ev.clientX > rect.right || ev.clientY < rect.top || ev.clientY > rect.bottom) return;
        mouse.x = ((ev.clientX-rect.left)/rect.width)*2-1;
        mouse.y = -((ev.clientY-rect.top)/rect.height)*2+1;
        ray.setFromCamera(mouse, camera);
        const hits = ray.intersectObjects(pickables.map(p=>p.mesh), false);
        if (!hits.length) return;
        const id = hits[0].object.userData.orgId;
        const o = DATA.organelles.find(x=>x.id===id);
        if (!o) return;
        document.getElementById('hs-title').textContent = o.label;
        document.getElementById('hs-text').textContent = o.detail;
        document.getElementById('hotspot').classList.remove('hidden');
    });
}

// ===================== 对比表 =====================
function buildCompare(){
    const c = DATA.compare; if (!c) return;
    const head = c.headers.map((h,i)=>`<th class="border border-slate-200 px-2 py-1 bg-teal-50 text-teal-800 font-bold ${i===0?'text-left':'text-center'}">${h}</th>`).join('');
    const rows = c.rows.map(r=>`<tr>${r.map((cell,i)=>`<td class="border border-slate-200 px-2 py-1 ${i===0?'text-left font-semibold text-slate-700':'text-center text-slate-600'}">${cell}</td>`).join('')}</tr>`).join('');
    document.getElementById('compare').innerHTML = `<thead><tr>${head}</tr></thead><tbody>${rows}</tbody>`;
    document.getElementById('compare-wrap').classList.remove('hidden');
}

// ===================== 启动 =====================
document.getElementById('cell-title').textContent = DATA.title || '';
document.getElementById('cell-sub').textContent = DATA.subtitle || '';
document.getElementById('steps').innerHTML = DATA.steps.map((s,i)=>
    `<div class="step-item rounded border border-transparent px-3 py-1.5 text-sm" data-i="${i}">
        <span class="font-mono text-[11px] text-teal-600 mr-2">${String(i+1).padStart(2,'0')}</span>${s}
    </div>`).join('');
document.getElementById('steps').addEventListener('click', ev=>{
    const item = ev.target.closest('.step-item'); if (item) setStep(+item.dataset.i);
});
document.getElementById('prev-btn').addEventListener('click', ()=>setStep(curStep-1));
document.getElementById('next-btn').addEventListener('click', ()=>setStep(curStep+1));
document.getElementById('rot-btn').addEventListener('click', ev=>{
    autoRotate = !autoRotate;
    ev.target.textContent = autoRotate ? '暂停旋转' : '继续旋转';
});
buildCompare();
init();
</script>
</body>
</html>
