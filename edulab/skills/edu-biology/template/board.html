<script type="application/json" id="lesson-data">__LESSON_DATA__</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById('lesson-data').textContent);
const BOARD = DATA.board || {};

// ===================== 数学环境（安全表达式求值） =====================
const MATHENV = {sqrt:Math.sqrt, abs:Math.abs, min:Math.min, max:Math.max, pow:Math.pow,
    sign:Math.sign, floor:Math.floor, ceil:Math.ceil, round:Math.round, PI:Math.PI, E:Math.E,
    log:Math.log, log2:Math.log2, log10:Math.log10, exp:Math.exp, sinh:Math.sinh, cosh:Math.cosh};
const _exprCache = {};
function evalExpr(expr, env){
    if (typeof expr !== 'string') return expr;
    const scope = Object.assign({}, MATHENV, env);
    const names = Object.keys(scope);
    const key = expr + '|' + names.join(',');
    let fn = _exprCache[key];
    if (!fn){ try { fn = Function(...names, '"use strict";return ('+expr.replace(/\^/g,'**')+');'); }
              catch(e){ fn = () => NaN; } _exprCache[key] = fn; }
    try { const v = fn(...names.map(n=>scope[n])); return (typeof v==='number') ? v : NaN; }
    catch(e){ return NaN; }
}
const resolveVal = (v, env) => (typeof v === 'string') ? evalExpr(v, env) : v;
function fmt(x, d=2){
    if (x === null || x === undefined || !isFinite(x)) return '—';
    let s = x.toFixed(d);
    if (s === '-' + (0).toFixed(d)) s = (0).toFixed(d);
    return s;
}
const fmtInt = x => (!isFinite(x) ? '—' : Math.round(x).toLocaleString('zh-CN'));

// ===================== 画布与世界坐标 =====================
const canvas = document.getElementById('board-canvas');
const ctx = canvas.getContext('2d');
let cssW = 0, cssH = 0, scX = 1, scY = 1, offX = 0, offY = 0;
const view = BOARD.view || {xRange:[0,10], yRange:[0,6]};
let EQUAL_ASPECT = false;               // 棋盘格等场景需要 x/y 等比例（正方形单元格）
const SX = x => offX + x*scX;
const SY = y => offY - y*scY;
const rMin = () => Math.min(scX, scY);

function resizeCanvas(){
    const rect = canvas.parentElement.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width*dpr; canvas.height = rect.height*dpr;
    canvas.style.width = rect.width+'px'; canvas.style.height = rect.height+'px';
    ctx.setTransform(1,0,0,1,0,0); ctx.scale(dpr,dpr);
    cssW = rect.width; cssH = rect.height;
    computeTransform();
    render();
}
function computeTransform(){
    const spanX = view.xRange[1]-view.xRange[0], spanY = view.yRange[1]-view.yRange[0];
    const mL=58, mR=14, mB=34, mT=16;
    let sx = (cssW-mL-mR)/spanX;
    let sy = (cssH-mB-mT)/spanY;
    if (EQUAL_ASPECT){                       // 棋盘格等需要正方形单元格
        const s = Math.min(sx, sy);
        sx = sy = s;
    }
    scX = sx; scY = sy;
    // 等比例时居中显示；否则让起点对齐到页边距
    if (EQUAL_ASPECT){
        offX = mL + ((cssW-mL-mR) - spanX*scX)/2 - view.xRange[0]*scX;
        offY = mT + ((cssH-mT-mB) - spanY*scY)/2 + spanY*scY + view.yRange[0]*scY;
    } else {
        offX = mL - view.xRange[0]*scX;
        offY = (cssH-mB) + view.yRange[0]*scY;
    }
}

// ===================== 绘制基元 =====================
const P = {
    grid:'#334155', axis:'#94a3b8', text:'#e2e8f0', dim:'#94a3b8', box:'#0f172a',
    dom:'#0d9488', rec:'#e11d48', het:'#f59e0b', mix:'#7c3aed',
    good:'#10b981', bad:'#ef4444', curve:'#2dd4bf', curve2:'#a78bfa',
    energy:['#166534','#15803d','#22c55e','#86efac'],
};
function label(x,y,text,color=P.text,align='center',size=12,weight='bold'){
    ctx.font=weight+' '+size+'px system-ui'; ctx.textAlign=align; ctx.textBaseline='middle';
    ctx.fillStyle=color; ctx.fillText(text, SX(x), SY(y));
}
function dashLine(x1,y1,x2,y2,color=P.axis,lw=1.2){
    ctx.strokeStyle=color; ctx.lineWidth=lw; ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(SX(x1),SY(y1)); ctx.lineTo(SX(x2),SY(y2)); ctx.stroke();
    ctx.setLineDash([]);
}
function solidLine(x1,y1,x2,y2,color,lw=2){
    ctx.strokeStyle=color; ctx.lineWidth=lw;
    ctx.beginPath(); ctx.moveTo(SX(x1),SY(y1)); ctx.lineTo(SX(x2),SY(y2)); ctx.stroke();
}
function axes(xr, yr, xlab, ylab, xticks, yticks){
    const ax=SX(xr[0]), ay=SY(yr[0]);
    ctx.strokeStyle=P.axis; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(SX(xr[1]),ay); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(ax,SY(yr[1])); ctx.stroke();
    ctx.font='bold 11px system-ui'; ctx.fillStyle=P.dim;
    ctx.textAlign='center'; ctx.textBaseline='top';
    if (xlab) ctx.fillText(xlab, (ax+SX(xr[1]))/2, ay+24);
    if (ylab){
        ctx.save(); ctx.translate(ax-32, (ay+SY(yr[1]))/2); ctx.rotate(-Math.PI/2);
        ctx.textAlign='center'; ctx.textBaseline='bottom'; ctx.fillText(ylab, 0, 0); ctx.restore();
    }
    ctx.font='normal 10px system-ui'; ctx.fillStyle=P.dim;
    ctx.textAlign='center'; ctx.textBaseline='top';
    (xticks||[]).forEach(t=>{ ctx.fillText(String(t), SX(t), ay+7); });
    ctx.textAlign='right'; ctx.textBaseline='middle';
    (yticks||[]).forEach(t=>{ ctx.fillText(String(t), ax-6, SY(t)); });
}
function plot(fn, xr, n, color, lw=2.6, fillTo=null){
    ctx.strokeStyle=color; ctx.lineWidth=lw; ctx.lineJoin='round';
    ctx.beginPath();
    for (let i=0;i<=n;i++){
        const x = xr[0] + (xr[1]-xr[0])*i/n, y = fn(x);
        if (!isFinite(y)) continue;
        i ? ctx.lineTo(SX(x),SY(y)) : ctx.moveTo(SX(x),SY(y));
    }
    ctx.stroke();
    if (fillTo !== null){
        ctx.lineTo(SX(xr[1]),SY(fillTo)); ctx.lineTo(SX(xr[0]),SY(fillTo)); ctx.closePath();
        ctx.fillStyle = 'rgba(45,212,191,.14)'; ctx.fill();
    }
}
// 取 1/2/5×10^k 的漂亮刻度
function niceTicks(a, b, n=5){
    const span = b-a;
    if (!(span>0) || !isFinite(span)) return [];
    const raw = span/n;
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const norm = raw/mag;
    const cand = [1,2,2.5,5,10];
    let best = cand[0];
    for (const c of cand) if (Math.abs(c-norm) < Math.abs(best-norm)) best = c;
    const step = best*mag;
    const out=[];
    for (let v=Math.ceil(a/step)*step; v<=b+step*1e-9; v+=step) out.push(Math.round(v/step)*step);
    return out.map(v => Math.abs(v)>=10000 ? +(v/10000)+'万' : +v.toFixed(6));
}
const rangeTicks=(a,b,n)=>{const o=[];for(let i=0;i<=n;i++)o.push(+(a+(b-a)*i/n).toFixed(6));return o;};

// ===================== 场景状态 =====================
let PARAMS = {};
function buildEnv(){
    const env = Object.assign({}, PARAMS);
    (BOARD.scalars||[]).forEach(s=>{ env[s.name] = evalExpr(s.expr, env); });
    return env;
}
function buildScene(){
    const env = buildEnv();
    const S = Object.assign({}, env);
    const sc = BOARD.scene || {};
    for (const k in sc){
        const v = sc[k];
        if (k === 'kind' || k === 'caption'){ S[k] = v; continue; }
        if (typeof v === 'string'){ const v2 = evalExpr(v, env); S[k] = isFinite(v2) ? v2 : v; }
        else if (Array.isArray(v)) S[k] = v.map(z => (typeof z === 'string') ? (isFinite(evalExpr(z,env))? evalExpr(z,env) : z) : z);
        else S[k] = v;
    }
    if (S.xRange && S.xRange.every(isFinite)) view.xRange = S.xRange;
    if (S.yRange && S.yRange.every(isFinite)) view.yRange = S.yRange;
    EQUAL_ASPECT = !!S.equalAspect;
    return S;
}

// ===================== 场景 1：遗传棋盘格 =====================
function drawPunnett(S){
    const rows = S.rowGametes, cols = S.colGametes;
    const nr = rows.length, nc = cols.length;
    const gap = 0.10, cw = 1.0;
    const gx0 = 1.15, gy0 = 0.55;                 // 左上留出演算表头
    // 表头
    ctx.font='bold 12px system-ui'; ctx.fillStyle=P.dim;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('♀ 卵细胞 →', SX(gx0 + nc*cw/2 - 0.1), SY(gy0 + nr*cw + 0.42));
    ctx.save(); ctx.translate(SX(gx0-0.45), SY(gy0 + nr*cw/2)); ctx.rotate(-Math.PI/2);
    ctx.fillText('♂ 精子 ↓', 0, 0); ctx.restore();
    // 列配子（上）
    cols.forEach((g, j)=>{
        const x = gx0 + j*cw + cw/2, y = gy0 + nr*cw + 0.20;
        ctx.font='bold 12px system-ui'; ctx.fillStyle=P.curve2; ctx.textAlign='center';
        ctx.fillText(g, SX(x), SY(y));
    });
    // 行配子（左）
    rows.forEach((g, i)=>{
        const x = gx0 - 0.22, y = gy0 + (nr-1-i)*cw + cw/2;
        ctx.font='bold 12px system-ui'; ctx.fillStyle=P.curve; ctx.textAlign='center';
        ctx.fillText(g, SX(x), SY(y));
    });
    // 单元格
    const cnt = S.count || {};
    const maxC = Math.max(1, ...Object.values(cnt));
    for (let i=0;i<nr;i++){
        for (let j=0;j<nc;j++){
            const gt = S.cells[i][j];
            const x = gx0 + j*cw, y = gy0 + (nr-1-i)*cw;
            const ph = S.phenoOf ? S.phenoOf[gt] : gt;
            const key = (S.phenoKey||{})[gt];
            const c = key!=null ? P[key] : P.dom;
            ctx.fillStyle = c; ctx.globalAlpha = 0.22;
            ctx.fillRect(SX(x+gap/2), SY(y+cw-gap/2), (cw-gap)*scX, (cw-gap)*scY);
            ctx.globalAlpha = 1;
            ctx.strokeStyle = c; ctx.lineWidth = 1.6;
            ctx.strokeRect(SX(x+gap/2), SY(y+cw-gap/2), (cw-gap)*scX, (cw-gap)*scY);
            ctx.font='bold 15px system-ui'; ctx.fillStyle=P.text; ctx.textAlign='center'; ctx.textBaseline='middle';
            ctx.fillText(gt, SX(x+cw/2), SY(y+cw/2));
            if (cnt[gt] / maxC > 1.5){    // 同一基因型出现多格时角标份数
                ctx.font='bold 10px system-ui'; ctx.fillStyle=c; ctx.textAlign='right'; ctx.textBaseline='top';
                ctx.fillText('×'+cnt[gt], SX(x+cw-gap/2-3), SY(y+cw-gap/2+3));
            }
        }
    }
    // 底部比例条
    const barY = 0.12, barH = 0.28;
    const total = Object.values(cnt).reduce((a,b)=>a+b,0) || 1;
    let bx = gx0;
    const widthAll = nc*cw;
    (S.phenoOrder||[]).forEach(([ph, n])=>{
        const w = widthAll * n / total;
        const c = (S.phenoKeyAgg||{})[ph] || P.dom;
        ctx.fillStyle=c; ctx.globalAlpha=.85;
        ctx.fillRect(SX(bx), SY(barY+barH), w*scX, barH*scY);
        ctx.globalAlpha=1;
        ctx.font='bold 11px system-ui'; ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.textBaseline='middle';
        if (w*scX > 30) ctx.fillText(n, SX(bx+w/2), SY(barY+barH/2));
        bx += w;
    });
    ctx.font='bold 10.5px system-ui'; ctx.fillStyle=P.dim; ctx.textAlign='left'; ctx.textBaseline='bottom';
    ctx.fillText('表现型比例', SX(gx0), SY(barY+barH+0.05));
    ctx.fillStyle=P.text;
    ctx.fillText(S.phenoRatioText||'', SX(gx0)+58, SY(barY+barH+0.05));
    // 结论/基因型比（左对齐 + 小字号，放在列配子与「♀卵细胞」标注之上）
    ctx.font='bold 11px system-ui'; ctx.fillStyle=P.text; ctx.textAlign='left'; ctx.textBaseline='bottom';
    ctx.fillText(S.footer||'', SX(gx0), SY(gy0 + nr*cw + 0.86));
}

// ===================== 场景 2：能量金字塔 =====================
function drawPyramid(S){
    const labels = S.labels || [];
    const n = labels.length;
    const effFrac = (S.effFrac!=null) ? S.effFrac : 0.1;
    const energies = (S.energyExprs||[]).map(e => resolveVal(e, S));
    const base = energies[0] || 1;
    // 条形最大宽度：两侧各留出给「名称」「能量值」的空间
    const spanX = view.xRange[1]-view.xRange[0];
    const cx = (view.xRange[0]+view.xRange[1])/2;
    const maxW = spanX * 0.52;
    const rowH = (view.yRange[1]-view.yRange[0]) / (n + 0.30);
    for (let i=0;i<n;i++){                      // i=0 为生产者，画在最下方
        const w = maxW * Math.max(energies[i]/base, 0.035);
        const yTop = view.yRange[0] + i*rowH + rowH*0.16;
        const col = P.energy[i % P.energy.length];
        ctx.fillStyle = col; ctx.globalAlpha = 0.92;
        ctx.fillRect(SX(cx-w/2), SY(yTop+rowH*0.78), w*scX, rowH*0.78*scY);
        ctx.globalAlpha = 1;
        ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 1.5;
        ctx.strokeRect(SX(cx-w/2), SY(yTop+rowH*0.78), w*scX, rowH*0.78*scY);
        const midY = SY(yTop + rowH*0.39);
        // 名称放左侧（右对齐，永不与条形重叠）；能量值放右侧（左对齐）
        ctx.font='bold 12px system-ui'; ctx.textBaseline='middle';
        ctx.textAlign='right'; ctx.fillStyle=P.text;
        ctx.fillText(labels[i], SX(cx-w/2) - 8, midY);
        ctx.textAlign='left'; ctx.fillStyle=P.curve;
        ctx.fillText(fmtInt(energies[i]) + ' kJ', SX(cx+w/2) + 8, midY);
        // 传递效率箭头（画在该层之上）
        if (i>0){
            ctx.font='bold 10.5px system-ui'; ctx.textAlign='center'; ctx.fillStyle=P.het;
            ctx.textBaseline='bottom';
            ctx.fillText('↑ ' + fmt(effFrac*100, 1) + '%', SX(cx), SY(yTop+rowH*0.80) - 2);
        }
    }
    if (S.footer){
        ctx.font='bold 11px system-ui'; ctx.textAlign='center'; ctx.textBaseline='top';
        ctx.fillStyle=P.dim;
        ctx.fillText(S.footer, SX(cx), SY(view.yRange[1]) + 4);
    }
}

// ===================== 场景 3：种群增长 =====================
function drawPopulation(S){
    const xr=[0, S.tMax], yr=[0, S.yMax];
    axes(xr, yr, '时间 / 代数', '种群数量', niceTicks(0, S.tMax, 6), niceTicks(0, S.yMax, 5));
    // J 型（会冲出图外——这正是"无限增长不可能"的直观表现）
    if (S.showJ!==false){
        const cross = Math.log(S.yMax/S.n0)/Math.log(S.lam);
        plot(t => S.n0 * Math.pow(S.lam, t), xr, 240, P.het, 2.6, null);
        if (cross < S.tMax){
            ctx.font='bold 10px system-ui'; ctx.fillStyle=P.het;
            ctx.textAlign='left'; ctx.textBaseline='bottom';
            ctx.fillText('↑ J 型冲出图外', Math.max(SX(cross)+4, SX(0)+6), SY(S.yMax)+34);
        }
    }
    // S 型
    if (S.showS!==false){
        const K = S.K, r = S.r, N0 = S.n0;
        plot(t => K / (1 + (K/N0 - 1)*Math.exp(-r*t)), xr, 240, P.curve, 3, null);
        dashLine(0, K, S.tMax, K, P.dim, 1.4);
        ctx.font='bold 10.5px system-ui'; ctx.fillStyle=P.dim; ctx.textAlign='left'; ctx.textBaseline='bottom';
        ctx.fillText('环境容纳量 K = ' + fmtInt(K), SX(0)+4, SY(K)-4);
        dashLine(0, K/2, S.tMax, K/2, '#64748b', 1.2);
        ctx.fillStyle='#94a3b8';
        ctx.fillText('K/2（增长速率最大）', SX(0)+4, SY(K/2)-4);
    }
    if (S.showJ!==false){
        ctx.font='bold 11px system-ui'; ctx.textAlign='left'; ctx.textBaseline='middle';
        ctx.fillStyle=P.het;
        ctx.fillText('J 型增长', SX(S.tMax*0.50), SY(S.yMax*0.55));
    }
    if (S.showS!==false){
        ctx.font='bold 11px system-ui'; ctx.textAlign='left'; ctx.textBaseline='middle';
        ctx.fillStyle=P.curve;
        ctx.fillText('S 型增长', SX(S.tMax*0.12), SY(S.yMax*0.30));
    }
    // 结论文字放在图内左上角（底部留给坐标轴名）
    if (S.footer){
        ctx.font='bold 11px system-ui'; ctx.textAlign='left'; ctx.textBaseline='top';
        ctx.fillStyle=P.dim;
        ctx.fillText(S.footer, SX(xr[0]) + 8, SY(yr[1]) + 8);
    }
}

// ===================== 场景 4：生理过程流程图 =====================
function drawFlow(S){
    const nodes = S.nodes || [];
    const byId = {}; nodes.forEach(n=>byId[n.id]=n);
    // 先画连线
    (S.edges||[]).forEach(e=>{
        const a = byId[e.from], b = byId[e.to];
        if (!a || !b) return;
        let x1, y1, x2, y2;
        const dir = e.dir || 'h';
        if (dir === 'v'){                       // a 在上，b 在下
            x1 = SX(a.x + a.w/2); y1 = SY(a.y);
            x2 = SX(b.x + b.w/2); y2 = SY(b.y + b.h);
        } else if (dir === 'vu'){               // a 在下，b 在上
            x1 = SX(a.x + a.w/2); y1 = SY(a.y + a.h);
            x2 = SX(b.x + b.w/2); y2 = SY(b.y);
        } else {                                // 水平：a 右缘 → b 左缘
            x1 = SX(a.x + a.w); y1 = SY(a.y + a.h/2);
            x2 = SX(b.x); y2 = SY(b.y + b.h/2);
        }
        const hl = (S.activeEdges||[]).includes(e.from+'>'+e.to);
        const col = hl ? P.good : '#64748b';
        ctx.strokeStyle = col; ctx.lineWidth = hl ? 2.8 : 1.8;
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
        const ang = Math.atan2(y2-y1, x2-x1);
        ctx.beginPath();
        ctx.moveTo(x2, y2);
        ctx.lineTo(x2-11*Math.cos(ang-0.4), y2-11*Math.sin(ang-0.4));
        ctx.lineTo(x2-11*Math.cos(ang+0.4), y2-11*Math.sin(ang+0.4));
        ctx.closePath(); ctx.fillStyle = col; ctx.fill();
        if (e.label){
            ctx.font='bold 10px system-ui'; ctx.fillStyle = hl?P.good:P.dim;
            ctx.textAlign='center'; ctx.textBaseline='middle';
            const lx = dir==='h' ? (x1+x2)/2 : x1 + 30;
            const ly = dir==='h' ? (y1+y2)/2 - 9 : (y1+y2)/2;
            ctx.fillText(e.label, lx, ly);
        }
    });
    // 再画节点
    nodes.forEach(n=>{
        const hl = (S.activeNodes||[]).includes(n.id);
        const x = SX(n.x), y = SY(n.y+n.h), w = n.w*scX, h = n.h*scY;
        ctx.fillStyle = n.color || '#1e293b';
        ctx.globalAlpha = hl ? 1 : 0.62;
        ctx.fillRect(x, y, w, h);
        ctx.globalAlpha = 1;
        ctx.strokeStyle = hl ? P.good : '#475569';
        ctx.lineWidth = hl ? 2.8 : 1.5;
        ctx.strokeRect(x, y, w, h);
        // 副标题可能是表达式（随滑块变化）
        let sub = n.sub;
        if (typeof sub === 'string'){
            const v = evalExpr(sub, S);
            sub = isFinite(v) ? (fmtInt(v) + (n.subUnit||'')) : sub;
        }
        const hasSub = !!sub;
        ctx.font = (hl?'bold ':'') + '12.5px system-ui';
        ctx.fillStyle = '#f1f5f9'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(n.label, x + w/2, y + h/2 + (hasSub ? -6 : 0));
        if (hasSub){
            ctx.font='10.5px system-ui'; ctx.fillStyle='#cbd5e1';
            ctx.fillText(sub, x + w/2, y + h/2 + 10);
        }
    });
    if (S.footer){
        ctx.font='bold 12px system-ui'; ctx.textAlign='center'; ctx.textBaseline='top';
        ctx.fillStyle=P.text;
        ctx.fillText(S.footer, SX((view.xRange[0]+view.xRange[1])/2), SY(view.yRange[1]) - 16);
    }
}

// ===================== 渲染主入口 =====================
function render(){
    ctx.clearRect(0,0,cssW,cssH);
    const S = buildScene();
    computeTransform();
    switch(S.kind){
        case 'punnett': drawPunnett(S); break;
        case 'pyramid': drawPyramid(S); break;
        case 'population': drawPopulation(S); break;
        case 'flow': drawFlow(S); break;
    }
    updateReadouts(S);
}

// ===================== 读数 =====================
function updateReadouts(env){
    (BOARD.readouts||[]).forEach(r=>{
        const el=document.getElementById('ro-'+r.id);
        if(!el) return;
        try{
            if (r.type==='expr'){
                const v=evalExpr(r.expr, env);
                const d = (r.int? fmtInt(v) : fmt(v, r.digits!=null?r.digits:2));
                el.textContent = d+(r.unit?' '+r.unit:'');
            } else if (r.type==='status'){
                const v=evalExpr(r.expr, env), rhs=(r.rhs!=null?r.rhs:0), op=r.op||'>';
                const ok = op==='<'? v<rhs-1e-9 : op==='>'? v>rhs+1e-9
                         : op==='=='? Math.abs(v-rhs)<1e-6
                         : op==='<='? v<=rhs+1e-9 : v>=rhs-1e-9;
                el.textContent = ok?(r.okText||'满足'):(r.badText||'不满足');
                el.style.color = ok?'#059669':'#dc2626';
            } else if (r.type==='text'){
                // 文本读数：先看能否当表达式求值，不能则原样显示（避免 "1 : 2 : 1" 变成 NaN）
                const raw = r.value;
                if (typeof raw === 'string'){
                    const v = evalExpr(raw, env);
                    el.textContent = (isFinite(v) && /^[\s\d+\-*/().A-Za-z_^]*$/.test(raw)) ? String(v) : raw;
                } else {
                    el.textContent = String(raw);
                }
            }
        }catch(e){ el.textContent='—'; }
    });
    if (BOARD.constant) document.getElementById('constant-val').textContent = BOARD.constant.label||'';
}

// ===================== 控制台构建 =====================
function renderKatex(el){ if (typeof renderMathInElement!=='undefined') renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}],throwOnError:false}); }
function buildConsole(){
    document.getElementById('prob-title').textContent=(DATA.lesson&&DATA.lesson.title)||'';
    document.getElementById('prob-sub').textContent=(DATA.lesson&&DATA.lesson.subtitle)||'';
    document.getElementById('prob-body').innerHTML=(DATA.lesson&&DATA.lesson.problem)||'';
    document.getElementById('scene-caption').textContent=(BOARD.scene&&BOARD.scene.caption)||'';
    document.getElementById('params').innerHTML=(BOARD.params||[]).map(p=>`
        <div>
            <div class="flex justify-between text-xs text-slate-600 mb-1">
                <span>${p.label||p.name}</span>
                <span id="pv-${p.name}" class="font-mono font-bold text-teal-700"></span>
            </div>
            <input type="range" id="ps-${p.name}" min="${p.min}" max="${p.max}" step="${p.step||0.01}" value="${p.value}" class="w-full">
            <div class="flex justify-between text-[10px] text-slate-400 mt-0.5"><span>${p.min}${p.unit||''}</span><span>${p.max}${p.unit||''}</span></div>
        </div>`).join('');
    (BOARD.params||[]).forEach(p=>{
        PARAMS[p.name]=p.value;
        const s=document.getElementById('ps-'+p.name);
        s.addEventListener('input', ()=>{ PARAMS[p.name]=parseFloat(s.value); syncParamVals(); render(); });
    });
    syncParamVals();
    document.getElementById('readouts').innerHTML=(BOARD.readouts||[]).map(r=>{
        if (r.highlight) return `<div class="flex justify-between items-center pt-1"><span class="text-slate-800 font-semibold">${r.label}</span><span id="ro-${r.id}" class="text-base font-bold bg-teal-50 text-teal-800 px-3 py-1 rounded-lg border border-teal-200">—</span></div>`;
        return `<div class="flex justify-between border-b border-dashed border-slate-200 pb-1"><span>${r.label}</span><span id="ro-${r.id}" class="font-bold" style="color:${r.color||'#0f172a'}">—</span></div>`;
    }).join('');
    if (BOARD.constant) document.getElementById('constant-block').classList.remove('hidden');
    document.getElementById('legend').innerHTML=(BOARD.legend||[]).map(it=>
        `<span class="flex items-center gap-1.5"><span class="w-3 h-3 inline-block rounded" style="background:${it.color}"></span>${it.text}</span>`).join('');
    document.getElementById('solution-body').innerHTML=(DATA.steps||[]).map((st,i)=>{
        const no=String(i+1).padStart(2,'0');
        return `<div class="${i>0?'border-t border-slate-100 pt-5':''}">
            <div class="flex items-start gap-4 mb-3">
                <span class="w-7 h-7 rounded-full bg-teal-100 text-teal-700 flex items-center justify-center font-bold font-mono text-sm flex-shrink-0">${no}</span>
                <h3 class="text-base font-bold text-slate-900 pt-0.5">${st.title||''}</h3>
            </div>
            <div class="text-slate-700 leading-relaxed text-sm space-y-2">${st.content||''}</div>
        </div>`;
    }).join('');
    document.getElementById('reset-btn').addEventListener('click', ()=>{
        (BOARD.params||[]).forEach(p=>{ PARAMS[p.name]=p.value; document.getElementById('ps-'+p.name).value=p.value; });
        syncParamVals(); render();
    });
    renderKatex(document.body);
}
function syncParamVals(){
    (BOARD.params||[]).forEach(p=>{
        const el=document.getElementById('pv-'+p.name);
        if(el) el.textContent=fmt(PARAMS[p.name], p.digits!=null?p.digits:2)+(p.unit||'');
    });
}

buildConsole();
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
</script>
